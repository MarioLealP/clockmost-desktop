# clockmost: only the devices Mario uses. Outputs go Easy Effects -> Realtek analog (DT 880 amp);
# the mic is the USB PnP one. Bluetooth (bluez) is untouched - it appears when it connects.
monitor.alsa.rules = [
  {
    # HDMI audio to the monitor + the USB capture card's audio
    matches = [
      { device.name = "alsa_card.pci-0000_0c_00.1" }
      { device.name = "alsa_card.usb-MACROSILICON_usb_video-02" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    # Realtek line-in/mic; its analog output stays (Easy Effects plays into it)
    matches = [ { node.name = "alsa_input.pci-0000_0e_00.4.analog-stereo" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    # never pick the raw Realtek output as a fallback default - that would skip the EQ
    matches = [ { node.name = "alsa_output.pci-0000_0e_00.4.analog-stereo" } ]
    actions = { update-props = { priority.session = 1, priority.driver = 1 } }
  }
]
