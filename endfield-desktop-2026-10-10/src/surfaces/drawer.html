<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Surface · app drawer (rule 13)</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../atoms/app-card.css">
  <link rel="stylesheet" href="drawer.css">
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060607; }
    #screen { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0b; }

    /* default ground: black Endfield floor, faint contours, vignette */
    #floor { position: absolute; inset: 0; }
    #vig { position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(1100px 640px at 60% 20%, rgba(255, 250, 0, 0.028), transparent 62%),
        radial-gradient(1700px 1100px at 50% 45%, transparent 36%, rgba(0, 0, 0, 0.62)); }

    /* the world behind the glass (context only — not the component) */
    .wnum { position: absolute; left: 40px; bottom: -40px; font: 900 italic 460px/1 var(--disp);
      letter-spacing: -0.04em; color: rgba(255, 255, 255, 0.028); pointer-events: none; }
    .win { position: absolute; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 6px;
      background: rgba(255, 255, 255, 0.035); overflow: hidden; }
    .win .tb { height: 30px; background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
    .win .ln { height: 8px; margin: 14px 18px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); }
    .win .ln.s { width: 55%; }

    /* controls (not the component) */
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 8px;
      align-items: center; padding: 0 14px; background: #121217; border-top: 1px solid #22232b; }
    .bar button { background: #22242c; color: #ddd; border: 1px solid #31333d; border-radius: 6px;
      padding: 8px 14px; font: inherit; cursor: pointer; }
    .bar button:hover { background: #2c2e38; }
    .bar .about { margin-left: auto; font: 10px var(--mono); letter-spacing: 0.14em; color: var(--i4); }
    .note { position: absolute; left: 40px; top: 8px; font: 10px var(--mono); letter-spacing: 0.14em;
      color: var(--i4); }
    .note b { color: var(--y); }
  </style>
</head>
<body>
<div id="screen">
  <canvas id="floor" width="1920" height="1080"></canvas>
  <div id="vig"></div>

  <!-- world -->
  <div class="wnum">02</div>
  <div class="win" style="left: 40px; top: 120px; width: 300px; height: 380px;">
    <div class="tb"></div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln s"></div>
  </div>
  <div class="win" style="right: 40px; top: 150px; width: 300px; height: 300px;">
    <div class="tb"></div><div class="ln"></div><div class="ln s"></div><div class="ln"></div>
  </div>
  <div class="win" style="left: 720px; bottom: 60px; width: 480px; height: 180px;">
    <div class="tb"></div><div class="ln"></div><div class="ln s"></div>
  </div>

  <div id="host"></div>
  <div class="note"><b>RULE 13</b> · SOLID LIGHT TOP → ALPHA → FROSTED GLASS → DARK FOOT · WIPE L→R (SLOTS RIDE IT) · SECONDARY FADES AFTER · EXIT = STATIC FADE</div>

  <div class="bar">
    <button id="bEnter">Enter</button>
    <button id="bExit">Exit (fade)</button>
    <span class="about">src/surfaces/drawer.html · core.js + atoms/app-card.js + drawer.js · rAF tweens · ?slow=N</span>
  </div>
</div>

<script src="../core.js"></script>
<script src="../atoms/app-card.js"></script>
<script src="drawer.js"></script>
<script>
"use strict";

/* ---- default ground ---- */
(function () {
  const g = document.getElementById("floor").getContext("2d");
  const N = EF.noise2(31);
  const p = new Path2D();
  EF.contours(
    1920, 1080, 16,
    (x, y) => N(x / 430, y / 430, 4) + 0.2 * Math.exp(-(((x - 1180) / 760) ** 2) - (((y - 380) / 520) ** 2)),
    0.035,
    (x1, y1, x2, y2) => { p.moveTo(x1, y1); p.lineTo(x2, y2); }
  );
  g.strokeStyle = "rgba(158, 163, 174, 0.12)";
  g.lineWidth = 1;
  g.stroke(p);
})();

/* ---- stand-in glyphs (until real icon assets are bound) ---- */

/* ---- the launcher (mock: 6 rows, the 6th clipped -> implies scroll) ---- */

const C = { or: "#ff7a1a", bl: "#5865f2", gr: "#1ed760", cy: "#00ffa2", az: "#3aa0ff", ye: "#fffa00", mg: "#ff1aac", st: "#6c6f76", rd: "#d91e36", vi: "#c139e6", am: "#ff980e" };

  A("Firefox", "FX-01", C.or, 2, "running", G.fox),      A("Discord", "DC-02", C.bl, 1, "running", G.chat),
  A("Spotify", "SP-03", C.gr, 0, "rest", G.music),          A("Kitty", "KT-04", C.cy, 3, "running", G.term),
  A("Steam", "ST-05", C.az, 2, "running", G.game),          A("Files", "FL-06", C.ye, 1, "running", G.files),
  A("Code", "CD-07", C.mg, 1, "running", G.code),            A("KeePass", "KP-08", C.st, 0, "rest", G.shield),
  A("GIMP", "GP-09", C.or, 0, "rest", G.brush),             A("VLC", "VL-10", C.am, 0, "rest", G.video),
  A("Docs", "DO-11", C.st, 0, "rest", G.doc),                A("Mail", "ML-12", C.rd, 0, "rest", G.mail),
  A("Photos", "PH-13", C.cy, 0, "rest", G.image),           A("Maps", "MP-14", C.az, 0, "rest", G.map),

  A("Docker", "DK-19", C.az, 0, "rest", G.cube),            A("Terminal", "TM-20", C.cy, 0, "rest", G.term),
  A("Thunderbird", "TB-21", C.az, 0, "rest", G.mail),       A("Element", "EL-22", C.cy, 0, "rest", G.chat),
  A("OBS Studio", "OB-23", C.st, 1, "rest", G.video),       A("Inkscape", "IN-24", C.or, 0, "rest", G.brush),
  A("Blender", "BL-25", C.am, 0, "rest", G.cube),           A("Krita", "KR-26", C.mg, 0, "rest", G.brush),
  A("Audacity", "AU-27", C.ye, 0, "rest", G.music),         A("LibreOffice", "LO-28", C.st, 0, "rest", G.doc),
  A("Signal", "SG-29", C.az, 0, "rest", G.chat),            A("Telegram", "TG-30", C.cy, 0, "rest", G.chat),
  A("Slack", "SL-31", C.vi, 0, "rest", G.chat),             A("Bitwarden", "BW-32", C.az, 0, "rest", G.shield),
  A("OnlyOffice", "OO-33", C.rd, 0, "rest", G.doc),         A("qBittorrent", "QB-34", C.az, 0, "rest", G.files),
  A("Transmission", "TR-35", C.rd, 0, "rest", G.files),     A("mpv", "MP-36", C.vi, 0, "rest", G.video),
  A("Shotcut", "SC-37", C.or, 0, "rest", G.video),          A("Kdenlive", "KD-38", C.mg, 0, "rest", G.video),
  A("Gedit", "GE-39", C.st, 0, "rest", G.doc),              A("Neovim", "NV-40", C.cy, 0, "rest", G.code),
  A("Emacs", "EM-41", C.vi, 0, "rest", G.code),             A("System Monitor", "SM-42", C.st, 0, "rest", G.calc),
  A("Ark", "AR-43", C.ye, 0, "rest", G.files),              A("Gwenview", "GW-44", C.az, 0, "rest", G.image),
  A("Spectacle", "SP-45", C.st, 0, "rest", G.image),        A("Okular", "OK-46", C.rd, 0, "rest", G.doc),
  A("Kate", "KA-47", C.az, 0, "rest", G.code),              A("Dolphin", "DL-48", C.cy, 0, "rest", G.files),

const d = EF.drawer({
  title: "Applications",
  apps: APPS,
  cols: 10,
  capacity: "56 APPS · 6 RUNNING",
  running: 6,
});
document.getElementById("host").appendChild(d);

document.getElementById("bEnter").onclick = () => d.open();
document.getElementById("bExit").onclick = () => d.close();
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "enter") d.open();
  else if (k === "escape") d.close();
});

d.open(); // autoplay so opening the file shows the motion
</script>
</body>
</html>
