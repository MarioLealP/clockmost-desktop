<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ds-dock · the dock</title>
<link rel="stylesheet" href="ds-shell.css">
<style>
  /* ---- the dock plate: frost + its own small details (own design, several layers) ---- */
  .dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); height: 72px;
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px 6px; border-radius: 2px; }
  /* hairline along the top inner edge */
  .dock .hair { position: absolute; left: 8px; right: 8px; top: 3px; height: 1px; background: rgba(255,255,255,.14); }
  /* tiny corner brackets (smaller cousins of .bk) */
  .tbk { position: absolute; width: 10px; height: 10px; pointer-events: none; }
  .tbk.tl { left: 4px; top: 4px; border-left: 2px solid rgba(241,241,244,.22); border-top: 2px solid rgba(241,241,244,.22); }
  .tbk.br { right: 4px; bottom: 4px; border-right: 2px solid rgba(241,241,244,.22); border-bottom: 2px solid rgba(241,241,244,.22); }
  /* hairline divider between the zones */
  .vdiv { flex: none; align-self: center; width: 1px; height: 40px; background: rgba(255,255,255,.10); }
  /* small print at the far right end: barcode over the micro code */
  .print { flex: none; align-self: center; display: flex; flex-direction: column; gap: 4px; opacity: .8; }

  /* ---- app tiles: the drawer's tile language at 52px ---- */
  .slot { position: relative; display: flex; flex-direction: column; gap: 2px; }
  .tile { position: relative; width: 52px; height: 52px; border-radius: 6px; overflow: hidden;
    background: rgba(70,74,82,.5); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.35); color: var(--ink); }
  .tile .topo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
  .tile .logo { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); }
  .tile .ltr { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    line-height: 1; font: 700 20px var(--body); }
  .tile .gly { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%);
    fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }
  /* coloured underbar per app (yellow = focused) */
  .tile .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--rc, #4A4E56); }

  /* ---- running state: dots under the tile (2 windows = 2 dots) ---- */
  .run { height: 4px; display: flex; justify-content: center; gap: 3px; }
  .run i { width: 4px; height: 4px; border-radius: 2px; background: var(--ink2); }
  .run i.f { background: var(--yellow); }

  /* corner markers sit on the slot so the tile keeps its clipped corners */
  .badge { position: absolute; top: -3px; right: -3px; min-width: 13px; height: 12px; padding: 0 3px;
    display: flex; align-items: center; justify-content: center; background: #0b0b0c;
    border: 1px solid rgba(255,255,255,.14); border-radius: 2px;
    font: 700 9px var(--mono); letter-spacing: .04em; color: var(--ink2); }

  /* ---- static hover example: tooltip above the Phonograph tile ---- */
  .tip { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%);
    padding: 5px 10px; background: rgba(11,11,12,.96); border: 1px solid rgba(255,255,255,.18); border-radius: 2px;
    font: 11px var(--mono); letter-spacing: .14em; color: var(--ink2); white-space: nowrap; }
  .tip::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -6px;
    border: 6px solid transparent; border-top: 6px solid rgba(11,11,12,.96); }

  /* ---- ?state=hidden: the clean desktop, just the faint handle ---- */
  .handle { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: 120px; height: 4px;
    border-radius: 2px; background: rgba(241,241,244,.20); display: none; }
</style>
</head>
<body>
<div class="stage">

  <!-- dimmed Firefox window behind, so the dock reads as an overlay -->
  <div class="win blur" style="left:310px; top:120px; width:1300px; height:760px;">
    <div class="wtop"><div class="wtitle">FIREFOX</div>
      <div class="wctl">
        <button type="button" class="wb" title="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button type="button" class="wb" title="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg></button>
        <button type="button" class="wb" title="Close"><svg viewBox="0 0 24 24"><path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5"/></svg></button>
      </div>
    </div>
    <div class="wbody"></div>
  </div>

  <!-- the dock -->
  <div class="dock frost" id="dock">
    <div class="hair"></div>
    <i class="tbk tl"></i><i class="tbk br"></i>

    <!-- app-drawer button -->
    <div class="slot">
      <div class="tile">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      </div>
      <div class="run"></div>
    </div>

    <div class="vdiv"></div>

    <!-- Firefox: focused, 2 windows -->
    <div class="slot">
      <div class="tile" style="--rc:var(--yellow)">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <img class="logo" src="firefox.svg" alt="">
        <div class="bar"></div>
      </div>
      <div class="run"><i class="f"></i><i class="f"></i></div>
    </div>

    <!-- Discord: running, 1 window, notification -->
    <div class="slot">
      <div class="tile" style="--rc:#00FFA2">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <div class="ltr">D</div>
        <div class="bar"></div>
      </div>
      <i class="notif pin"></i>
      <div class="run"><i></i></div>
    </div>

    <!-- Phonograph: running, 1 window, tooltip above -->
    <div class="slot">
      <div class="tile" style="--rc:#9BE86E">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><path d="M9 17V6l8-2v11"/><circle cx="6.5" cy="17" r="2.6"/><circle cx="14.5" cy="15" r="2.6"/></svg>
        <div class="bar"></div>
      </div>
      <div class="run"><i></i></div>
      <div class="tip">PHONOGRAPH</div>
    </div>

    <!-- Kitty: running, 1 window -->
    <div class="slot">
      <div class="tile" style="--rc:#4A4E56">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <div class="ltr">K</div>
        <div class="bar"></div>
      </div>
      <div class="run"><i></i></div>
    </div>

    <!-- Dolphin -->
    <div class="slot">
      <div class="tile" style="--rc:#3FD0E8">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><path d="M3 6h6.5l2 2.5H21V19H3z"/></svg>
        <div class="bar"></div>
      </div>
      <div class="run"></div>
    </div>

    <!-- Steam -->
    <div class="slot">
      <div class="tile" style="--rc:#00FFA2">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <div class="ltr">S</div>
        <div class="bar"></div>
      </div>
      <div class="run"></div>
    </div>

    <!-- KeePassXC -->
    <div class="slot">
      <div class="tile" style="--rc:#4A4E56">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17 12v3.5M20 12v2.5"/></svg>
        <div class="bar"></div>
      </div>
      <div class="run"></div>
    </div>

    <!-- Spectacle -->
    <div class="slot">
      <div class="tile" style="--rc:#ff1aac">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="8" y="8" width="8" height="8"/></svg>
        <div class="bar"></div>
      </div>
      <div class="run"></div>
    </div>

    <!-- Lutris -->
    <div class="slot">
      <div class="tile" style="--rc:#cfc6f4">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <div class="ltr">L</div>
        <div class="bar"></div>
      </div>
      <div class="run"></div>
    </div>

    <div class="vdiv"></div>

    <!-- downloads stack, 3 new -->
    <div class="slot">
      <div class="tile">
        <img class="topo" src="ds-topo-card.svg" alt="">
        <svg class="gly" viewBox="0 0 24 24"><path d="M12 3v7m0 0 2.8-2.8M12 10 9.2 7.2"/><path d="M4 13l2.5-4h11L20 13v6H4z"/></svg>
      </div>
      <div class="badge">3</div>
      <div class="run"></div>
    </div>

    <!-- small print -->
    <div class="print"><span class="barcode"></span><div class="micro">DOCK · 09 PINNED</div></div>
  </div>

  <div class="handle" id="handle"></div>
</div>
<script>
"use strict";
/* states: default = dock visible; ?state=hidden = clean desktop with only the handle. No motion. */
if (new URLSearchParams(location.search).get("state") === "hidden") {
  document.getElementById("dock").style.display = "none";
  document.getElementById("handle").style.display = "block";
}
</script>
</body>
</html>
