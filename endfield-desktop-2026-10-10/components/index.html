<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Endfield desktop · layout overview</title>
<style>
  :root { --ground: #0F0F10; --ink: #f1f1f4; --dim: #7d8089; --yellow: #FFFA00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px "Segoe UI", system-ui, sans-serif; }
  header { padding: 28px 32px 8px; }
  h1 { margin: 0; font: 600 18px Consolas, monospace; letter-spacing: .2em; }
  h1 span { color: var(--dim); font-weight: 400; }
  p { margin: 8px 0 0; color: var(--dim); font: 11px Consolas, monospace; letter-spacing: .14em; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 28px; padding: 24px 32px 48px; }
  figure { margin: 0; }
  .shot { display: block; position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 2px; }
  .shot:hover { border-color: var(--yellow); }
  /* live page scaled down: 1920x1080 into the card width */
  .shot iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; pointer-events: none;
    transform-origin: 0 0; transform: scale(var(--k, .25)); }
  figcaption { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  figcaption b { font: 600 13px Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
  .t { font: 700 9px Consolas, monospace; letter-spacing: .14em; padding: 2px 6px; background: #26282d; color: var(--dim); }
  .t.approved { background: var(--yellow); color: #111; }
  .st { margin-left: auto; display: flex; gap: 8px; }
  .st a { color: var(--dim); font: 11px Consolas, monospace; letter-spacing: .1em; text-decoration: none; }
  .st a:hover { color: var(--yellow); }
</style>
</head>

<script>
  // scale each live preview to its card width
  const fit = () => document.querySelectorAll(".shot").forEach((s) => s.style.setProperty("--k", s.clientWidth / 1920));
  addEventListener("resize", fit); fit();
</script>
