<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ds-app-drawer · test</title>
<style>
  :root { --head: #FFFFFF; --ink: #e8e9ec; --dim: #6c6f76; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0F0F10 url(../wallpaper.png) center / cover; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

  /* the drawer: a rectangle, solid top, frosted glass fading down */
  .drawer { position: relative; width: 980px; height: 600px; border-radius: 2px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  /* the glass: its own layer, with a hole cut under each app tile (mask built in JS) */
  .glass { position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg, var(--head) 0%, var(--head) 16%, rgba(255,255,255,.7) 24%, rgba(230,232,238,.32) 40%, rgba(40,42,48,.5) 100%);
    -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2); }
  .head { position: relative; z-index: 1; height: 64px; flex: none; color: #111; display: flex; align-items: center;
    padding: 0 24px; font: 600 18px "Segoe UI", system-ui, sans-serif; letter-spacing: .04em; }
  .head .cap { margin-left: auto; font: 12px Consolas, monospace; letter-spacing: .14em; color: #6c6f76; }
  .head::after { content: ""; position: absolute; left: 24px; right: 24px; bottom: 0; height: 1px; background: #33363C; }
  .body { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 22px 24px; overflow: hidden;
    display: flex; flex-direction: column; }
  /* search bar: sits at the bottom of the body (mock, not wired) */
  .search { margin-top: auto; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border: 1px solid rgba(255,255,255,.22); border-radius: 6px; background: rgba(20,21,24,.55);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.5); font: 13px Consolas, monospace; letter-spacing: .14em; color: #8a8e96; }
  .search b { color: #FFFA00; font-weight: 700; letter-spacing: .1em; }
  /* demo toggle (not the component) */
  .ctl { position: fixed; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; }
  .ctl button { background: #22242c; color: #ddd; border: 1px solid #31333d; border-radius: 6px;
    padding: 8px 14px; font: 12px Consolas, monospace; letter-spacing: .1em; cursor: pointer; }

  /* app tile: same language as ds-app-card (2px corners, topo, logo, name, code, underbar) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 120px); justify-content: start; gap: 14px; }
  .tile { position: relative; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.35); background: rgba(70,74,82,.5);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); color: var(--ink); }
  /* a cell is one socket; the app tile (if any) sits on top of its socket */
  .cell { position: relative; aspect-ratio: 1 / 1; }
  .cell .tile { position: absolute; inset: 0; }
  .tile.empty { border: 1px solid rgba(255,255,255,.18);
    background: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.4px) 0 0 / 9px 9px, rgba(70,74,82,.3); }
  .tile .topo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
  .tile .logo { position: absolute; left: 50%; top: 27%; width: 46%; height: 46%; transform: translateX(-50%); }
  .tile .letter { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; line-height: 1; font: 700 29px "Segoe UI", system-ui, sans-serif; }
  .tile .name { position: absolute; left: 0; right: 0; top: 78%; text-align: center; font: 600 18px Consolas, monospace; letter-spacing: .12em; }
  .tile .code { position: absolute; left: 0; right: 0; top: 6%; text-align: center; font: 10px Consolas, monospace; letter-spacing: .22em; color: #6c6f76; }
  .tile .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--rc, #3FD0E8); }
</style>
</head>
<body>
<div class="drawer">
  <div class="glass" id="glass"></div>
  <div class="head">Applications<span class="cap">12 APPS · 1 RUNNING</span></div>
  <div class="body"><div class="grid" id="grid"></div>
    <div class="search"><b>›››</b> SEARCH APPLICATIONS</div></div>
</div>
<div class="ctl"><button id="tog">Win key · open / close</button></div>
<script>
"use strict";
/* [name, underbar colour, code, logo] — logo "fx" = firefox.svg, otherwise a letter */
const APPS = [
  ["Firefox", "#FF7A1A", "v128 · BRW", "fx"], ["Discord", "#00FFA2", "· COM", "D"],
  ["Spotify", "#9BE86E", "· MUS", "S"], ["Kitty", "#4A4E56", "· TRM", "K"],
  ["Steam", "#00FFA2", "· GAM", "S"], ["Files", "#FFFA00", "· FIL", "F"],
  ["Code", "#FF1AAC", "· DEV", "C"], ["KeePass", "#4A4E56", "· SEC", "K"],
  ["Gimp", "#FF7A1A", "· IMG", "G"], ["VLC", "#FFFA00", "· VID", "V"],
  ["Docs", "#4A4E56", "· DOC", "D"], ["Mail", "#D91E36", "· MAL", "M"],
];
const appTile = ([name, rc, code, logo]) => `
  <div class="tile" style="--rc:${rc}">
    <img class="topo" src="ds-topo-card.svg" alt="">
    ${logo === "fx" ? '<img class="logo" src="firefox.svg" alt="">' : `<span class="letter">${logo}</span>`}
    <div class="name">${name}</div>
    <div class="code">${code}</div>
    <div class="bar"></div>
  </div>`;
/* every cell gets a socket; the first cells also get an app tile on top */
document.getElementById("grid").innerHTML = Array.from({ length: APPS.length + sockets() }, (_, i) =>
  `<div class="cell"><div class="tile empty"></div>${APPS[i] ? appTile(APPS[i]) : ""}</div>`).join("");

/* empty sockets: fill every grid cell that fits in the body, after the real apps */
function sockets() {
  const body = document.querySelector(".body"), TILE = 120, GAP = 14;
  const cols = Math.floor((body.clientWidth - 48 + GAP) / (TILE + GAP));
  const rows = Math.floor((body.clientHeight - 44 + GAP) / (TILE + GAP));
  return Math.max(0, cols * rows - APPS.length);
}

/* cut a hole in the glass under every tile: an SVG mask, opaque everywhere except the tile rects */
function cut() {
  const R = document.querySelector(".drawer").getBoundingClientRect();
  /* hole with the same 6px corners as the tile */
  const hole = (r) => {
    const x = r.left - R.left, y = r.top - R.top, w = r.width, h = r.height, k = 6;
    return `M${x + k} ${y}H${x + w - k}A${k} ${k} 0 0 1 ${x + w} ${y + k}V${y + h - k}A${k} ${k} 0 0 1 ${x + w - k} ${y + h}` +
      `H${x + k}A${k} ${k} 0 0 1 ${x} ${y + h - k}V${y + k}A${k} ${k} 0 0 1 ${x + k} ${y}Z`;
  };
  const d = `M0 0H${R.width}V${R.height}H0Z` + [...document.querySelectorAll(".tile")].map((t) => hole(t.getBoundingClientRect())).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${R.width}" height="${R.height}"><path fill="#000" fill-rule="evenodd" d="${d}"/></svg>`;
  const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  document.getElementById("glass").style.maskImage = url;
  document.getElementById("glass").style.webkitMaskImage = url;
}
cut();
addEventListener("resize", cut);

/* motion: open = slide up 60px (SETTLE) with the empty sockets, then each app fades in over its socket;
   close = fade in place (rule 15: exits never move). ?slow=N slows everything N times. */
const SLOW = Math.max(1, +new URLSearchParams(location.search).get("slow") || 1);
const SETTLE = (t) => 1 - Math.pow(1 - t, 4); // ease-out stand-in for cubic-bezier(0.16,1,0.3,1)
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const drawer = document.querySelector(".drawer");
const apps = [...document.querySelectorAll(".tile:not(.empty)")];
let isOpen = false, token = 0;

function play(total, frame) {
  const my = ++token, t0 = performance.now();
  const step = (now) => {
    if (my !== token) return;
    const e = (now - t0) / SLOW;
    frame(Math.min(e, total));
    if (e < total) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function show() {
  isOpen = true;
  play(500 + 150, (e) => {
    drawer.style.opacity = clamp01(e / 280);
    drawer.style.transform = `translateY(${(60 * (1 - SETTLE(clamp01(e / 500)))).toFixed(2)}px)`;
    apps.forEach((t) => {
      const k = clamp01((e - 500) / 150);
      t.style.opacity = k;
      t.parentElement.querySelector(".empty").style.opacity = 1 - k;
    });
  });
}
function hide() {
  isOpen = false;
  play(280, (e) => { drawer.style.opacity = 1 - clamp01(e / 280); });
}
function toggle() { isOpen ? hide() : show(); }

/* start closed */
drawer.style.opacity = 0;
drawer.style.transform = "translateY(60px)";
apps.forEach((t) => { t.style.opacity = 0; });
document.getElementById("tog").onclick = toggle;
addEventListener("keydown", (e) => { if (e.key === "Meta" || e.key === "OS") toggle(); });
if (new URLSearchParams(location.search).has("open")) show();
</script>
</body>
</html>
