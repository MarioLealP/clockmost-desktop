<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ds-window - window frame + tiling (layout mock 03)</title>
<link rel="stylesheet" href="ds-shell.css">
<style>
  /* page-specific styles only: placeholder window content, snap zone, state switcher.
     Layout mock - no motion. Frame itself comes from ds-shell.css (.win/.wtop/.wtitle/.wctl/.wb/.wbody). */

  /* state switcher: plain micro links, bottom-left over the stage, outside the windows */
  .switch { position: absolute; left: 16px; bottom: 10px; z-index: 99; display: flex; gap: 10px; }
  .switch a { color: var(--faint); text-decoration: none; }
  .switch a.on { color: var(--yellow); }              /* the active state = selected */
  .switch i { color: var(--ghost); font-style: normal; }

  /* ---- placeholder: Kitty (dark terminal) ---- */
  .kitty { background: #0b0c0e; padding: 18px 22px; font: 13px/1.9 var(--mono); }
  .kline { white-space: pre; color: var(--ink2); }
  .kline.dim { color: var(--dim); }
  .kline.mod { color: rgba(217,30,54,.72); }
  .kline .u { color: #79c46a; }
  .kline .p { color: #6fa8dc; }
  .kline .b { color: #d98a7a; }
  .kcur { display: inline-block; width: 8px; height: 15px; vertical-align: -3px; background: var(--yellow); }
  .kprint { position: absolute; right: 16px; bottom: 10px; }

  /* ---- placeholder: Dolphin (file manager) ---- */
  .dolphin { display: flex; }
  .dside { flex: none; width: 210px; padding: 16px 0; background: var(--rail);
    border-right: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; }
  .dside .label { padding: 0 18px 12px; }
  .dplace { height: 32px; display: flex; align-items: center; padding: 0 18px; font: 13px var(--body); color: var(--ink2); }
  .dplace.on { background: rgba(255,255,255,.06); color: var(--ink); box-shadow: inset 3px 0 0 var(--yellow); }
  .dside .micro { margin-top: auto; padding: 0 18px 34px; }   /* clears the state switcher band */
  .dmain { flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(255,255,255,.015); }
  .drow { flex: none; height: 34px; display: grid; grid-template-columns: 1fr 90px 110px; align-items: center;
    gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .drow.head { height: 30px; border-bottom: 1px solid rgba(255,255,255,.10); }
  .drow.head span { font: 700 10px var(--mono); letter-spacing: .2em; color: var(--faint); }
  .drow .fname { font: 13px var(--body); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .fsize, .drow .fdate { font: 11px var(--mono); letter-spacing: .08em; color: var(--dim); }
  .dfoot { flex: none; margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 10px 18px; border-top: 1px solid rgba(255,255,255,.08); }

  /* ---- placeholder: Phonograph mini (track list) ---- */
  .phono { display: flex; flex-direction: column; padding: 14px 0 0; background: #121217; }
  .phono .label { padding: 4px 20px 12px; }
  .prow { flex: none; display: flex; align-items: center; gap: 16px; padding: 13px 20px;
    border-bottom: 1px solid rgba(255,255,255,.05); }
  .prow.on { background: rgba(207,198,244,.12); }   /* first row highlighted lavender */
  .prow .pt { font: 600 15px var(--body); color: var(--ink); }
  .prow .pa { margin-top: 3px; font: 10px var(--mono); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
  .prow .ptime { margin-left: auto; font: 12px var(--mono); letter-spacing: .1em; color: var(--dim); }
  .pfoot { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 10px 20px; }

  /* ---- placeholder: Discord mini (chat lines) ---- */
  .discord { display: flex; flex-direction: column; padding: 16px 0 0; background: var(--chat); }
  .discord .label { padding: 0 20px 12px; }
  .cline { display: flex; gap: 12px; padding: 6px 20px; }
  .cline .cn { flex: none; width: 92px; font: 600 13px var(--body); text-align: right; }
  .cline .ct { font: 13px/1.5 var(--body); color: var(--ink2); }
  .cfoot { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 10px 20px; border-top: 1px solid rgba(255,255,255,.08); }

  /* ---- snap state: zone preview + dragged window + cursor ---- */
  .snapzone { position: absolute; left: 8px; top: 8px; width: 948px; height: 1064px; border-radius: 2px;
    border: 1px solid rgba(255,250,0,.6); background: rgba(255,250,0,.06);
    display: flex; align-items: center; justify-content: center; }
  .snapzone .micro { color: var(--dim); }
  .cursor-arr { position: absolute; left: 806px; top: 322px; width: 26px; height: 26px; z-index: 40;
    fill: rgba(12,12,13,.9); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="wins"></div>
  <nav class="switch micro" id="switch">
    <a data-s="float">FLOAT</a><i>·</i>
    <a data-s="halves">HALVES</a><i>·</i>
    <a data-s="stack">STACK</a><i>·</i>
    <a data-s="quad">QUAD</a><i>·</i>
    <a data-s="full">FULL</a><i>·</i>
    <a data-s="snap">SNAP</a>
  </nav>
</div>

<script>
"use strict";
/* layout mock 03: window frame + tiling states, chosen with ?state= (default = stack). No motion. */
const STATES = ["float", "halves", "stack", "quad", "full", "snap"];
const q = new URLSearchParams(location.search);
const state = STATES.indexOf(q.get("state")) >= 0 ? q.get("state") : "stack";

const TITLES = {
  kitty: 'KITTY <span>· ~/src/clockmost-desktop</span>',
  dolphin: 'DOLPHIN <span>· HOME</span>',
  phono: 'PHONOGRAPH <span>· SAPPHIRE</span>',
  discord: 'DISCORD <span>· #GENERAL</span>'
};

/* ---------- placeholder content (static, believable at a glance) ---------- */
function kittyBody() {
  const P = '<span class="u">benylin@clockmost</span> <span class="p">~/src/clockmost-desktop</span> <span class="b">(main)</span>&gt; ';
  return `
  <div class="kline">${P}git status</div>
  <div class="kline dim">On branch main</div>
  <div class="kline dim">Your branch is up to date with 'origin/main'.</div>
  <div class="kline"> </div>
  <div class="kline">Changes not staged for commit:</div>
  <div class="kline dim">  (use "git add &lt;file&gt;..." to update what will be committed)</div>
  <div class="kline mod">        modified:   components/ds-window.html</div>
  <div class="kline mod">        modified:   orders/03-report.md</div>
  <div class="kline"> </div>
  <div class="kline">${P}<i class="kcur"></i></div>
  <div class="micro kprint">TTY1 · 80×24 · SR-1415</div>`;
}

function dolphinBody() {
  const files = [
    ["Desktop", "—", "2026-10-12"], ["Documents", "—", "2026-10-11"], ["Downloads", "—", "2026-10-09"],
    ["Music", "—", "2026-09-27"], ["Pictures", "—", "2026-09-14"], ["src", "—", "2026-10-12"],
    [".config", "—", "2026-10-08"], ["wallpaper.png", "2.8 MB", "2026-08-14"],
    ["notes.md", "4.1 KB", "2026-10-10"], [".todo.md", "312 B", "2026-10-12"]
  ];
  const places = ["Home", "Desktop", "Documents", "Downloads", ".config", "Drives/Data"];
  return `
  <aside class="dside">
    <div class="label">PLACES</div>
    ${places.map((p, i) => `<div class="dplace${i === 0 ? " on" : ""}">${p}</div>`).join("\n    ")}
    <div class="micro">NTFS · 2 DRIVES</div>
  </aside>
  <div class="dmain">
    <div class="drow head"><span>NAME</span><span>SIZE</span><span>MODIFIED</span></div>
    ${files.map(f => `<div class="drow"><span class="fname">${f[0]}</span><span class="fsize">${f[1]}</span><span class="fdate">${f[2]}</span></div>`).join("\n    ")}
    <div class="dfoot"><span class="micro">10 ITEMS · 41.2 GB FREE · /DEV/SDA2 · EXT4</span><span class="barcode"></span></div>
  </div>`;
}

function phonoBody() {
  const rows = [
    ["Glassy Sky", "SAPPHIRE", "4:20"],
    ["Seishun Complex", "SAPPHIRE", "3:21"],
    ["Train Back Home", "MAGIC: THE GATHERING", "3:35"]
  ];
  return `
  <div class="label">QUEUE · 3 TRACKS</div>
  ${rows.map((r, i) => `<div class="prow${i === 0 ? " on" : ""}"><div><div class="pt">${r[0]}</div><div class="pa">${r[1]}</div></div><div class="ptime">${r[2]}</div></div>`).join("\n  ")}
  <div class="pfoot"><span class="barcode"></span><span class="micro">SR-1415 · 33 RPM · SIDE A</span></div>`;
}

function discordBody() {
  const lines = [
    ["Kuri", "var(--violet)", "did the window mock land yet?"],
    ["Benylin", "var(--green)", "building it now - tiling states"],
    ["Cura", "var(--cyan)", "stack layout is the one I use most"],
    ["Sapphire", "var(--magenta)", "keep the gaps at 8px on the side monitor"],
    ["Benylin", "var(--green)", "checked twice"]
  ];
  return `
  <div class="label">CLOCKMOST · #GENERAL</div>
  ${lines.map(l => `<div class="cline"><span class="cn" style="color:${l[1]}">${l[0]}</span><span class="ct">${l[2]}</span></div>`).join("\n  ")}
  <div class="cfoot"><span class="micro">GUILD · CLOCKMOST · 4 ONLINE</span><span class="barcode"></span></div>`;
}

const BODIES = { kitty: kittyBody, dolphin: dolphinBody, phono: phonoBody, discord: discordBody };

/* ---------- window frame (ds-shell.css classes) ---------- */
function win(o) {
  return `
<div class="win ${o.cls}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;${o.style || ""}">
  <div class="wtop">
    <div class="wtitle">${TITLES[o.app]}</div>
    <div class="wctl">
      <button class="wb"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="wb"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg></button>
      <button class="wb"><svg viewBox="0 0 24 24"><path d="M5 5l5 5M14 14l5 5M19 5l-5 5M10 14l-5 5"/></svg></button>
    </div>
  </div>
  <div class="wbody ${o.app}">${BODIES[o.app]()}</div>
</div>`;
}

/* ---------- layouts: 8px gaps and 8px from the screen edges (tiled) ---------- */
const LAYOUTS = {
  /* two floating windows: focused Kitty front, unfocused Dolphin behind, offset up-left */
  float: [
    { app: "dolphin", x: 248, y: 132, w: 800, h: 520, cls: "blur" },
    { app: "kitty", x: 548, y: 308, w: 1100, h: 680, cls: "focus" }
  ],
  /* halves: two windows side by side */
  halves: [
    { app: "kitty", x: 8, y: 8, w: 948, h: 1064, cls: "focus" },
    { app: "dolphin", x: 964, y: 8, w: 948, h: 1064, cls: "blur" }
  ],
  /* stack: 1 + 2 - one left half, two stacked right (Mario's usual) */
  stack: [
    { app: "kitty", x: 8, y: 8, w: 948, h: 1064, cls: "focus" },
    { app: "dolphin", x: 964, y: 8, w: 948, h: 528, cls: "blur" },
    { app: "discord", x: 964, y: 544, w: 948, h: 528, cls: "blur" }
  ],
  /* quad: 2x2 grid, all four placeholders */
  quad: [
    { app: "kitty", x: 8, y: 8, w: 948, h: 528, cls: "focus" },
    { app: "dolphin", x: 964, y: 8, w: 948, h: 528, cls: "blur" },
    { app: "phono", x: 8, y: 544, w: 948, h: 528, cls: "blur" },
    { app: "discord", x: 964, y: 544, w: 948, h: 528, cls: "blur" }
  ],
  /* full: one maximized window, its title bar on top */
  full: [
    { app: "dolphin", x: 0, y: 0, w: 1920, h: 1080, cls: "max focus" }
  ],
  /* snap: the halves desktop while dragging - zone preview left, dragged window small under the cursor */
  snap: [
    { app: "dolphin", x: 964, y: 8, w: 948, h: 1064, cls: "blur" },
    { app: "kitty", x: 640, y: 330, w: 560, h: 392, cls: "focus", style: "opacity:.7;z-index:30;" }
  ]
};

let html = "";
if (state === "snap") {
  html += `<div class="snapzone"><div class="micro">SNAP · LEFT HALF</div></div>`;
}
for (const o of LAYOUTS[state]) html += win(o);
if (state === "snap") {
  html += `<svg class="cursor-arr" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>`;
}
document.getElementById("wins").innerHTML = html;

for (const a of document.querySelectorAll("#switch a")) {
  if (a.getAttribute("data-s") === state) a.className = "on";
  else a.setAttribute("href", "?state=" + a.getAttribute("data-s"));
}
</script>
</body>
</html>
