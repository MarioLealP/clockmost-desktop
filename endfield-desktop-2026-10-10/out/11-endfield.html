<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · Endfield (layered)</title>
<style>
  :root { --W: 1920; --H: 1080; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 64px 0; overflow: hidden; }
  #fit { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #screen { position: absolute; inset: 0; overflow: hidden; border-radius: 6px; background: #111; }
  #wall { position: absolute; inset: 0; }
  #wins { position: absolute; inset: 0; }
  #seam { position: absolute; top: 0; width: 0; height: 100%; pointer-events: none; display: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud.on { pointer-events: auto; }
  #edge { position: absolute; left: 0; right: 0; top: 0; height: 10px; z-index: 50; }
  #felt-note { position: absolute; right: 12px; bottom: 8px; font-size: 12px; opacity: .35; }
  .win { position: absolute; display: flex; flex-direction: column; overflow: hidden; background: #1b1c22; }
  .win .titlebar { height: 34px; flex: none; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #aab; background: #15161b; user-select: none; }
  .win .content { flex: 1; position: relative; overflow: hidden; }
  /* fake app bodies (neutral; concepts may restyle) */
  .ff .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #1f2027; }
  .ff .tab { padding: 6px 14px; background: #2a2b33; border-radius: 6px 6px 0 0; font-size: 12px; color: #bbb; }
  .ff .tab.on { background: #34353e; color: #eee; }
  .ff .url { margin: 6px 8px; height: 30px; border-radius: 6px; background: #2a2b33; display: flex; align-items: center; padding: 0 12px; color: #889; font-size: 12px; }
  .ff .page { padding: 24px 48px; }
  .ff .h { height: 22px; width: 55%; background: #3a3c48; border-radius: 4px; margin-bottom: 18px; }
  .line { height: 10px; background: #2c2e38; border-radius: 3px; margin: 9px 0; }
  .dc { display: flex; height: 100%; }
  .dc .side { width: 220px; background: #17181d; padding: 14px 10px; }
  .dc .chan { height: 18px; margin: 10px 4px; border-radius: 4px; background: #23252c; }
  .dc .chat { flex: 1; padding: 18px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; }
  .dc .msg { display: flex; gap: 12px; }
  .dc .av { width: 38px; height: 38px; border-radius: 50%; background: #3b3f6a; flex: none; }
  .dc .bub { flex: 1; }
  .kt { background: #0f1014; height: 100%; padding: 16px 18px; font: 13px ui-monospace, monospace; color: #9fb; white-space: pre; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 8px; align-items: center; padding: 0 14px; background: #121217; border-top: 1px solid #22232b; }
  #bar button { background: #22242c; color: #ddd; border: 1px solid #31333d; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #2c2e38; }
  #bar .sep { width: 1px; height: 28px; background: #2a2b33; margin: 0 4px; }
  #bar .about { margin-left: auto; font-size: 12px; color: #889; max-width: 520px; text-align: right; }
  kbd { font: 11px ui-monospace, monospace; background: #2c2e38; border-radius: 3px; padding: 1px 4px; }
/* ---- 11 · Endfield (layered) ------------------------------------------------------------ */
#screen {
  --g: #0f0f10; --s1: #17181a; --s2: #1e2024; --well: #0a0a0b; --ln: #33363c; --ln2: #4a4e56;
  --i1: #f0f0f2; --i2: #a8abb2; --i3: #6c6f76; --i4: #44474d;
  --y: #fffa00; --cy: #00ffa2; --mg: #ff1aac; --or: #ff7a1a;
  --glow: 0 0 0.55rem rgba(255, 250, 0, 0.4);
  --disp: Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif;
  --body: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  --ch16: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  --ch15: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
  --ch10: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  --hatch: repeating-linear-gradient(135deg, rgba(74, 78, 86, 0.55) 0 1px, transparent 1px 6px);
  background: var(--g); border-radius: 0;
}

/* ---- wallpaper: dot-matrix fading off the edges, steel guides, microtext; still ---- */
#wall { background: var(--g); }
.ef-wdots { position: absolute; inset: 0;
  background-image: radial-gradient(rgba(240, 240, 242, 0.11) 1px, transparent 1.2px); background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 25%, transparent 100%);
  mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 25%, transparent 100%); }
.ef-gl { position: absolute; background: var(--ln); opacity: 0.55; }
.ef-gl.h { left: 0; right: 0; height: 1px; }
.ef-gl.v { top: 0; bottom: 0; width: 1px; }
.ef-wticks i { position: absolute; top: 126px; width: 1px; height: 6px; background: var(--ln2); }
.ef-wbrk { position: absolute; width: 40px; height: 40px; border: 2px solid var(--ln2); }
.ef-wbrk.tl { left: 28px; top: 28px; border-right: 0; border-bottom: 0; }
.ef-wbrk.br { right: 28px; bottom: 28px; border-left: 0; border-top: 0; }
.ef-wmark { position: absolute; left: 232px; top: 470px; font: 600 64px var(--disp); letter-spacing: 0.3em; color: rgba(240, 240, 242, 0.06); display: flex; align-items: center; gap: 28px; }
.ef-wmark em { font: 13px var(--mono); letter-spacing: 0.14em; color: var(--i4); font-style: normal; }
.ef-wmark .ef-wd { width: 18px; height: 18px; border: 2px solid rgba(255, 250, 0, 0.35); transform: rotate(45deg); }
.ef-micro { position: absolute; font: 10px/1.5 var(--mono); letter-spacing: 0.08em; color: var(--i4); user-select: none; }
.ef-wcode { position: absolute; right: 232px; bottom: 120px; font: 600 12px var(--disp); letter-spacing: 0.3em; color: var(--i4); }

/* ---- windows: back-plate · surface (edge + face) · rail · brackets ---- */
.win { background: transparent; overflow: visible; display: block; }
.ef-back { position: absolute; left: 8px; top: 8px; right: 0; bottom: 0; clip-path: var(--ch16);
  background: var(--hatch), rgba(30, 32, 36, 0.7); }
.ef-surf { position: absolute; left: 0; top: 0; right: 8px; bottom: 8px; }
.ef-edge { position: absolute; inset: 0; background: var(--ln); clip-path: var(--ch16); }
.win.focused .ef-edge { background: var(--ln2); }
.ef-face { position: absolute; inset: 1px; clip-path: var(--ch15); background: var(--s1); display: flex; flex-direction: column; overflow: hidden; }
.win .titlebar { height: 36px; flex: none; gap: 12px; padding: 0 16px 0 20px; background: var(--s2); border-bottom: 1px solid var(--ln); color: var(--i3); }
.win .title { font: 600 13px var(--disp); letter-spacing: 0.16em; text-transform: uppercase; color: var(--i3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win.focused .title { color: var(--i1); }
.ef-tele { margin-left: auto; font: 11px var(--mono); letter-spacing: 0.06em; color: var(--i4); white-space: nowrap; }
.ef-tele b { font-weight: 400; color: var(--i4); }
.win.focused .ef-tele { color: var(--i3); }
.win.focused .ef-tele b { color: rgba(255, 250, 0, 0.7); }
.ef-dia { position: relative; flex: none; display: inline-block; width: 9px; height: 9px; border: 2px solid var(--i3); transform: rotate(45deg); }
.ef-dia i { position: absolute; inset: -2px; background: var(--y); box-shadow: var(--glow); transform: scale(0); }
.win.focused .ef-dia { border-color: var(--y); }
.win.focused .ef-dia i { transform: scale(1); }
.ef-frail { position: absolute; left: 1px; top: 1px; width: 3px; height: calc(100% - 44px); pointer-events: none;
  background: linear-gradient(var(--y), var(--y)) 0 0 / 3px 36px no-repeat,
    linear-gradient(180deg, rgba(255, 250, 0, 0.5), rgba(255, 250, 0, 0) 55%) 0 36px / 1px 100% no-repeat;
  clip-path: inset(0 0 100% 0); }
.win.focused .ef-frail { clip-path: inset(0); }
.ef-brk { position: absolute; width: 14px; height: 14px; border: 2px solid rgba(255, 250, 0, 0.55); opacity: 0; pointer-events: none; }
.ef-brk.tl { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.ef-brk.br { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.win.focused .ef-brk { opacity: 1; }
.ef-orail { position: absolute; left: 0; top: 0; width: calc(100% - 8px); height: 3px; background: var(--y); box-shadow: var(--glow); opacity: 0; transform-origin: 0 50%; pointer-events: none; z-index: 3; }
.ef-odia { position: absolute; left: -5px; top: -4px; width: 11px; height: 11px; background: var(--y); box-shadow: var(--glow); opacity: 0; pointer-events: none; z-index: 3; }
.ef-wedge { position: absolute; left: -1px; top: 0; width: 2px; height: calc(100% - 8px); opacity: 0; pointer-events: none; z-index: 3;
  background: linear-gradient(180deg, var(--y), rgba(255, 250, 0, 0.35) 30%, rgba(255, 250, 0, 0) 85%); }
.win .content { flex: 1; }

/* ---- app skins ---- */
.ff .tabs { gap: 4px; padding: 8px 10px 0; background: var(--s2); border-bottom: 1px solid var(--ln); }
.ff .tab { position: relative; border-radius: 0; background: #23262b; color: var(--i3); padding: 8px 18px 8px 28px;
  font: 600 12px var(--disp); letter-spacing: 0.12em; text-transform: uppercase;
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); }
.ff .tab::before { content: ""; position: absolute; left: 11px; top: 50%; width: 6px; height: 6px; margin-top: -4px; border: 1.5px solid var(--i4); transform: rotate(45deg); }
.ff .tab.on { background: var(--s1); color: var(--i1); }
.ff .tab.on::before { background: var(--y); border-color: var(--y); box-shadow: var(--glow); }
.ff .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--y); }
.ff .url { margin: 8px 10px; height: 30px; border-radius: 0; background: var(--well); border: 1px solid var(--ln); color: var(--i3); font: 12px var(--mono); letter-spacing: 0.04em; }
.ff .page { padding: 28px 52px; }
.ff .h { border-radius: 0; background: #34373e; }
.line { border-radius: 0; background: #25272c; }
.dc .side { background: #131416; border-right: 1px solid var(--ln); padding: 16px 12px; }
.dc .chan { position: relative; background: transparent; border-radius: 0; margin: 12px 4px; }
.dc .chan::before { content: ""; position: absolute; left: 4px; top: 5px; width: 6px; height: 6px; border: 1.5px solid var(--i4); transform: rotate(45deg); }
.dc .chan::after { content: ""; position: absolute; left: 22px; top: 5px; height: 8px; width: 62%; background: #2a2d33; }
.dc .chan:nth-child(3n)::after { width: 44%; }
.dc .chan:nth-child(3) { background: rgba(255, 250, 0, 0.04); box-shadow: inset 2px 0 0 var(--y); }
.dc .chan:nth-child(3)::before { background: var(--y); border-color: var(--y); box-shadow: var(--glow); }
.dc .chan:nth-child(3)::after { background: #5a5e66; }
.dc .av { border-radius: 0; background: #2a2d33; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.dc .bub .line:first-child { background: #4a4e56 !important; }
.kt { position: relative; background: var(--well); color: var(--i2); font: 13px/20px var(--mono); padding: 16px 20px; }
.kt::before { content: ""; position: absolute; left: 0; top: 116px; width: 3px; height: 20px; background: var(--y); }
.kt::after { content: ""; position: absolute; left: 3px; right: 0; top: 116px; height: 20px; background: linear-gradient(90deg, rgba(255, 250, 0, 0.06), transparent 40%); }

/* ---- overlay: measuring rail ---- */
.ef-ov { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
#seam, #hud { z-index: 2; }
#hud { z-index: 5; }
.ef-meas > * { position: absolute; left: 0; top: 0; }
.ef-meas .mt { width: 100%; height: 1px; top: 1px; background: var(--ln2); opacity: 0; }
.ef-meas .ms { width: 1px; height: 3px; background: var(--y); box-shadow: var(--glow); transform-origin: 0 0; }
.ef-meas .mk { width: 1px; height: 30px; margin-left: -0.5px; }
.ef-meas .k0 { background: var(--ln2); }
.ef-meas .k1 { background: var(--y); width: 2px; margin-left: -1px; }
.ef-meas .ml { top: 46px; display: flex; align-items: center; gap: 10px; white-space: nowrap; padding: 6px 12px 6px 14px;
  background: rgba(10, 10, 11, 0.94); border: 1px solid var(--ln2); box-shadow: inset 3px 0 0 var(--y);
  font: 14px var(--mono); color: var(--i1); clip-path: var(--ch10); opacity: 0; }
.ef-meas .ml b { font-weight: 700; letter-spacing: 0.08em; }
.ef-meas .ml i { font-style: normal; color: var(--y); letter-spacing: -0.1em; order: 3; }
.ef-meas .ml.rev i { order: 0; }
.ef-meas .ml em { font-style: normal; color: var(--i3); font-size: 12px; }

/* ---- seam ---- */
.ef-seam { position: absolute; inset: 0; overflow: visible; }
.sm-hair { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ln); }
.sm-strip { position: absolute; left: calc(50% - 2px); width: 4px; height: 150px; opacity: 0.8;
  background: repeating-linear-gradient(180deg, var(--ln2) 0 3px, transparent 3px 5px, var(--ln) 5px 6px, transparent 6px 11px, var(--i4) 11px 13px, transparent 13px 18px); }
.sm-strip.a { top: 48px; }
.sm-strip.b { bottom: 48px; }
.sm-ticks i { position: absolute; left: calc(50% - 3px); width: 7px; height: 1px; background: var(--ln2); }
.sm-ticks i.maj { left: calc(50% - 5px); width: 11px; background: var(--i3); }
.sm-run { position: absolute; left: calc(50% - 1px); top: 0; width: 3px; height: 140px; opacity: 0;
  background: linear-gradient(180deg, rgba(255, 250, 0, 0), var(--y)); box-shadow: var(--glow); }
.sm-read { position: absolute; left: 50%; top: 50%; opacity: 0; transform: translate(-50%, -50%); white-space: nowrap;
  padding: 6px 10px; background: rgba(10, 10, 11, 0.95); border: 1px solid var(--ln2); box-shadow: inset 0 2px 0 var(--y);
  font: 700 13px var(--mono); letter-spacing: 0.08em; color: var(--i1); }

/* ---- HUD ---- */
.efh { position: absolute; inset: 0; overflow: hidden; }
.efh-dim { position: absolute; inset: 0; background: rgba(6, 6, 7, 0.45); opacity: 0; }
.efh-plate { position: absolute; top: 0; right: 0; bottom: 0; width: 600px; background: rgba(15, 15, 16, 0.9); border-left: 1px solid var(--ln); }
.efh-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(240, 240, 242, 0.12) 1px, transparent 1.2px); background-size: 22px 22px;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000 60%, transparent), linear-gradient(90deg, transparent, #000 50%);
  mask-image: linear-gradient(90deg, transparent, #000 70%); }
.efh-prail { position: absolute; left: -1px; top: 0; width: 3px; height: 120px; background: var(--y); }
.efh-pm { left: 40px; bottom: 28px; }
.efh-stack { position: absolute; top: 40px; right: 40px; width: 520px; display: flex; flex-direction: column; gap: 14px; }
.efh-card { position: relative; }
.efh-card .bk { position: absolute; inset: 0; transform: translate(6px, 6px); clip-path: var(--ch16); background: var(--hatch), rgba(30, 32, 36, 0.75); }
.efh-card .fc { position: relative; left: -6px; top: -6px; background: var(--s1); border: 1px solid var(--ln); clip-path: var(--ch16); padding: 16px 20px; }
.efh-card .lab { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); letter-spacing: 0.14em; color: var(--i3); text-transform: uppercase; }
.efh-card .sl { color: var(--i4); }
.efh-card .lab .r { margin-left: auto; color: var(--i4); }
.efh .ef-dia { width: 8px; height: 8px; border-color: var(--i3); }
.efh .ef-dia.on { border-color: var(--y); }
.efh .ef-dia.on i { transform: scale(1); }
.efh-card.clock .fc { padding: 22px 24px 18px; }
.efh-card .tri { position: absolute; left: 0; top: 0; right: 16px; height: 3px; transform-origin: 0 50%;
  background: linear-gradient(90deg, var(--y) 0 76%, var(--cy) 76% 88%, var(--mg) 88% 100%); }
.efh-card .time { position: relative; margin-top: 46px; height: 128px; font: 600 150px/0.85 var(--disp); font-stretch: condensed;
  font-variation-settings: "wdth" 75; letter-spacing: -0.01em; color: var(--i1); font-variant-numeric: tabular-nums; }
.efh-card .time span { position: absolute; left: 0; top: 0; white-space: nowrap; }
.efh-card .time .echo { top: -0.17em; color: var(--y); opacity: 0.18; transform: translateX(3px) scaleX(1.01);
  clip-path: polygon(0 0, 100% 0, 100% 34%, 0 34%, 0 58%, 100% 58%, 100% 74%, 0 74%); }
.efh-card .date { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--ln);
  font: 13px var(--mono); letter-spacing: 0.16em; color: var(--i2); }
.efh-card .date .strip { flex: 1; height: 8px; opacity: 0.8;
  background: repeating-linear-gradient(90deg, var(--ln2) 0 3px, transparent 3px 5px, var(--ln) 5px 6px, transparent 6px 11px, var(--i4) 11px 13px, transparent 13px 18px); }
.efh-card .date .ix { color: var(--i4); }
.efh-card .tr { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; }
.efh-card .ti { display: inline-flex; align-items: center; gap: 9px; font: 600 13px var(--disp); letter-spacing: 0.12em; color: var(--i2); }
.efh-card.note .in { display: flex; gap: 14px; align-items: flex-start; }
.efh-card.note .fc { padding: 14px 20px; }
.efh-card .sq { flex: none; width: 10px; height: 10px; margin-top: 4px; background: var(--or); }
.efh-card .nb { flex: 1; min-width: 0; }
.efh-card .src { display: flex; font: 700 11px var(--mono); letter-spacing: 0.14em; color: var(--i3); }
.efh-card .src span { margin-left: auto; font-weight: 400; color: var(--i4); }
.efh-card .tx { margin-top: 4px; font: 15px var(--body); color: var(--i1); }
.efh-card.search .fc { background: var(--well); padding: 14px 20px; }
.efh-card.search .in { display: flex; align-items: center; gap: 14px; }
.efh-card .chev { font: 700 16px var(--mono); color: var(--y); letter-spacing: -0.12em; }
.efh-card .ph { font: 12px var(--mono); letter-spacing: 0.14em; color: var(--i4); }
.efh-card .caret { width: 2px; height: 18px; background: var(--y); margin-left: auto; opacity: 0.8; }

</style>
</head>
<body>
<div id="stage"><div id="fit"><div id="screen">
  <div id="wall"></div><div id="wins"></div><div id="seam"></div><div id="hud"></div><div id="edge"></div>
</div></div></div>
<div id="bar">
  <button data-a="open">Open <kbd>O</kbd></button>
  <button data-a="close">Close focused <kbd>X</kbd></button>
  <span class="sep"></span>
  <button data-a="r11">Snap 1:1 <kbd>1</kbd></button>
  <button data-a="r12">1:2 <kbd>2</kbd></button>
  <button data-a="r21">2:1 <kbd>3</kbd></button>
  <span class="sep"></span>
  <button data-a="focus">Switch focus <kbd>Tab</kbd></button>
  <button data-a="full">Fullscreen <kbd>F</kbd></button>
  <button data-a="hud">HUD <kbd>H</kbd> / hover top edge</button>
  <span class="about">Every window and HUD panel is a stack of Endfield plates that shear and slide over each other on staggered timings, then lock into one clean stack.</span>
</div>
<script>
// 11 · Endfield (layered): every window / HUD panel is a stack of plates that slide over one another on
// staggered timings and lock into one clean stack at rest. Exits run the plates in reverse, faster.
(() => {
  "use strict";
  const SW = 1920;
  const SH = 1080;
  const GAP = 14;
  const OFF = 8; // back-plate offset (down-right)
  let ctx = null;
  let ov = null;
  let winCount = 0;
  const hudO = {};
  const seamO = {};

  // ---- easing + tween engine (rAF clocked by performance.now(), timer fallback for headless) ----
  function bez(x1, y1, x2, y2) {
    const cx = 3 * x1;
    const bx = 3 * (x2 - x1) - cx;
    const ax = 1 - cx - bx;
    const cy = 3 * y1;
    const by = 3 * (y2 - y1) - cy;
    const ay = 1 - cy - by;
    const sx = (u) => ((ax * u + bx) * u + cx) * u;
    const sy = (u) => ((ay * u + by) * u + cy) * u;
    return (t) => {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      let lo = 0;
      let hi = 1;
      let u = t;
      for (let i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        if (sx(u) < t) lo = u;
        else hi = u;
      }
      return sy(u);
    };
  }
  const SNAP = bez(1, 0, 0.7, 1);
  const SETTLE = bez(0.16, 1, 0.3, 1);
  const LIN = (t) => t;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const P = (e, start, dur, ease = LIN) => ease(clamp((e - start) / dur));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function tick(f) {
    let done = false;
    const g = () => {
      if (done) return;
      done = true;
      f();
    };
    requestAnimationFrame(g);
    setTimeout(g, 24);
  }
  // fn(elapsedMs) runs once synchronously at 0, then every frame until ms; alive() lets a newer tween take over
  function tween(ms, fn, alive) {
    return new Promise((res) => {
      const t0 = performance.now();
      fn(0);
      const step = () => {
        if (alive && !alive()) return res(false);
        const e = Math.min(ms, performance.now() - t0);
        fn(e);
        if (e < ms) tick(step);
        else res(true);
      };
      tick(step);
    });
  }
  function claim(o, k) {
    o[k] = (o[k] || 0) + 1;
    const v = o[k];
    return () => o[k] === v;
  }
  function D(cls, parent, html) {
    const e = document.createElement("div");
    e.className = cls;
    if (html) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  const INK = [240, 240, 242];
  const INK3 = [108, 111, 118];
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",")})`;
  const clear = (els, props) => els.forEach((el) => props.forEach((p) => (el.style[p] = "")));

  // ---- window structure: back-plate · surface (edge + face{titlebar, content}) · rail · brackets ----
  function build(el) {
    if (el._ef) return el._ef;
    const tb = el.querySelector(".titlebar");
    const ct = el.querySelector(".content");
    const title = tb.querySelector(".title");
    const back = D("ef-back");
    const surf = D("ef-surf");
    D("ef-edge", surf);
    const face = D("ef-face", surf);
    face.append(tb, ct);
    const rail = D("ef-frail", surf);
    const brk = [D("ef-brk tl", surf), D("ef-brk br", surf)];
    const orail = D("ef-orail");
    const odia = D("ef-odia");
    const wedge = D("ef-wedge");
    el.prepend(back, surf);
    el.append(orail, odia, wedge);
    const dia = document.createElement("span");
    dia.className = "ef-dia";
    dia.innerHTML = "<i></i>";
    tb.insertBefore(dia, title);
    const tele = document.createElement("span");
    tele.className = "ef-tele";
    tb.appendChild(tele);
    const n = ++winCount;
    el._ef = { back, surf, face, tb, ct, title, dia, fill: dia.firstChild, tele, rail, brk, orail, odia, wedge, n };
    return el._ef;
  }
  function tele(win, w, h) {
    const f = build(win.el);
    const r = win.rect || { w: 0, h: 0 };
    f.tele.innerHTML = `WIN-${String(f.n).padStart(2, "0")} · ${Math.round(w ?? r.w)}×${Math.round(h ?? r.h)} · <b>▸▸▸</b>`;
  }
  function setBrk(f, k, out = 18) {
    // k: 0 = off (pushed out, 1.25x), 1 = locked on the corners
    const d = (1 - k) * out;
    const s = 1 + 0.25 * (1 - k);
    f.brk[0].style.opacity = f.brk[1].style.opacity = k;
    f.brk[0].style.transform = `translate(${-d}px, ${-d}px) scale(${s})`;
    f.brk[1].style.transform = `translate(${d}px, ${d}px) scale(${s})`;
  }

  // ---- wallpaper ----
  function micro(lines) {
    return lines.map(esc).join("<br>");
  }
  function wallpaper(wallEl) {
    const screen = wallEl.parentNode;
    ov = D("ef-ov");
    screen.insertBefore(ov, screen.querySelector("#hud"));
    let ticks = "";
    for (let x = 120; x < SW; x += 120) ticks += `<i style="left:${x}px"></i>`;
    wallEl.innerHTML = `<div class="ef-wdots"></div>
      <div class="ef-gl h" style="top:132px"></div><div class="ef-gl h" style="top:948px"></div>
      <div class="ef-gl v" style="left:212px"></div><div class="ef-gl v" style="left:1708px"></div>
      <div class="ef-wticks">${ticks}</div>
      <div class="ef-wbrk tl"></div><div class="ef-wbrk br"></div>
      <div class="ef-wmark"><span class="ef-wd"></span>CLOCKMOST<em>// DESKTOP · SIDE DISPLAY</em></div>
      <div class="ef-micro" style="left:232px;top:150px">${micro(["SYS.ARR // 1920×1080 · 60HZ", "GRID 120 · CUT 16 · RAIL 3", "LAYER STACK · 4 PLATES", "STATUS: NOMINAL"])}</div>
      <div class="ef-micro" style="right:232px;top:150px;text-align:right">${micro(["NODE CLOCKMOST.COM", "LINK 192.168.10.110", "TANG ▪ OK · VAULT ▪ OK", "SEC.62 // FROZEN"])}</div>
      <div class="ef-micro" style="left:232px;bottom:150px">${micro(["▸▸▸ SNAP 1,0,.7,1", "▸▸▸ SETTLE .16,1,.3,1", "T 120 / 280 / 600"])}</div>
      <div class="ef-wcode">EF-11 · LYR</div>`;
    // structure windows the moment the harness creates them (before first paint)
    new MutationObserver((ms) => {
      for (const m of ms)
        for (const n of m.addedNodes) {
          if (!(n instanceof HTMLElement) || !n.classList.contains("win")) continue;
          build(n);
          if (ctx) n.dataset.efNew = "1";
        }
    }).observe(screen.querySelector("#wins"), { childList: true });
  }

  function ready(c) {
    ctx = c;
    c.state.list.forEach((w) => tele(w));
  }

  // ---- OPEN: rail draws → back-plate slides in → surface wipes over it → title → content → brackets ----
  async function onOpen(win) {
    const el = win.el;
    const f = build(el);
    tele(win);
    const sw = win.rect.w - OFF;
    const alive = claim(f, "gk");
    claim(f, "fq");
    f.orail.style.transformOrigin = "0 50%";
    const ok = await tween(
      660,
      (e) => {
        // 1 · yellow rail across the top edge (SNAP, 120 ms)
        const a = SNAP(P(e, 0, 130));
        const railOp = 1 - P(e, 440, 140);
        f.orail.style.opacity = railOp;
        f.orail.style.transform = `scaleX(${a})`;
        f.odia.style.opacity = railOp * (a > 0 ? 1 : 0);
        f.odia.style.transform = `translateX(${a * sw}px) rotate(45deg)`;
        // 2 · back-plate slides in from the left (SETTLE)
        const b = P(e, 50, 320, SETTLE);
        f.back.style.transform = `translateX(${(1 - b) * -96}px)`;
        f.back.style.opacity = P(e, 50, 90);
        // 3 · surface slides over it with a wipe from the left, 60 ms later
        const s = P(e, 115, 320, SETTLE);
        const sx = (1 - s) * -44;
        f.surf.style.transform = `translateX(${sx}px)`;
        f.surf.style.clipPath = `inset(-3px ${(1 - s) * (sw + 6) - 3}px -3px -3px)`;
        f.wedge.style.transform = `translateX(${sx + s * sw}px)`;
        f.wedge.style.opacity = s > 0 && s < 1 ? clamp(s * 6) * (1 - P(s, 0.75, 0.25)) : 0;
        // 4 · title band wipes in, diamond fills, title text wipes
        const t = P(e, 200, 290, SETTLE);
        f.tb.style.transform = `translateX(${(1 - t) * -30}px)`;
        f.tb.style.clipPath = `inset(0 ${(1 - t) * 100}% 0 0)`;
        const tt = P(e, 260, 280, SETTLE);
        f.title.style.clipPath = `inset(0 ${(1 - tt) * 100}% 0 0)`;
        f.fill.style.transform = `scale(${P(e, 380, 120, SNAP)})`;
        f.tele.style.opacity = P(e, 400, 180);
        f.tele.style.transform = `translateX(${(1 - P(e, 400, 240, SETTLE)) * 14}px)`;
        // 5 · content fades / rises in, trailing the surface
        const c = P(e, 290, 330, SETTLE);
        f.ct.style.opacity = P(e, 290, 200);
        f.ct.style.transform = `translate(${(1 - c) * -22}px, ${(1 - c) * 8}px)`;
        // 6 · focus rail drops down the left edge, brackets snap onto the corners
        f.rail.style.clipPath = `inset(0 0 ${(1 - P(e, 400, 240, SNAP)) * 100}% 0)`;
        setBrk(f, P(e, 520, 130, SNAP));
        f.title.style.color = mix(INK3, INK, P(e, 300, 200));
      },
      alive,
    );
    if (ok) {
      clear([f.orail, f.odia, f.back, f.surf, f.wedge, f.tb, f.title, f.fill, f.tele, f.ct, f.rail, ...f.brk], ["opacity", "transform", "clipPath", "color", "transformOrigin"]);
    }
    delete el.dataset.efNew;
  }

  // ---- CLOSE: content cuts → title retracts left → surface wipes off right → back-plate collapses into the rail → diamond ----
  async function onClose(win) {
    const el = win.el;
    const f = build(el);
    const sw = win.rect.w - OFF;
    const alive = claim(f, "gk");
    claim(f, "fq");
    const seam = ctx && ctx.seam;
    if (seam) {
      claim(seamO, "k");
      const o0 = parseFloat(seam.style.opacity || "1");
      tween(140, (e) => (seam.style.opacity = o0 * (1 - P(e, 0, 140))));
    }
    f.back.style.transformOrigin = "50% 0";
    f.orail.style.transformOrigin = "50% 50%";
    await tween(
      420,
      (e) => {
        const k = P(e, 0, 90, SNAP);
        setBrk(f, 1 - k, 14);
        f.rail.style.clipPath = `inset(0 0 ${P(e, 0, 120, SNAP) * 100}% 0)`;
        const c = P(e, 0, 110, SNAP);
        f.ct.style.opacity = 1 - c;
        f.ct.style.transform = `translateX(${c * 16}px)`;
        const t = P(e, 50, 140, SNAP);
        f.tb.style.transform = `translateX(${-t * 30}px)`;
        f.tb.style.clipPath = `inset(0 ${t * 100}% 0 0)`;
        const s = P(e, 110, 170, SNAP);
        const sx = s * 46;
        f.surf.style.transform = `translateX(${sx}px)`;
        f.surf.style.clipPath = `inset(-3px -3px -3px ${s * (sw + 6) - 3}px)`;
        f.wedge.style.transform = `translateX(${sx + s * sw}px)`;
        f.wedge.style.opacity = s > 0 && s < 1 ? 1 : 0;
        // back-plate lingers ~60 ms, then collapses up into the yellow rail
        const q = P(e, 230, 100, SNAP);
        f.back.style.transform = `translateY(${-q * OFF}px) scaleY(${Math.max(0.004, 1 - q)})`;
        f.back.style.opacity = 1 - P(e, 320, 20);
        f.orail.style.opacity = P(e, 260, 50) * (1 - P(e, 400, 20));
        const z = P(e, 320, 80, SNAP);
        f.orail.style.transform = `scaleX(${1 - z})`;
        f.odia.style.opacity = P(e, 330, 20) * (1 - P(e, 395, 25));
        f.odia.style.transform = `translateX(${sw / 2}px) rotate(45deg) scale(${1 - P(e, 390, 30)})`;
      },
      alive,
    );
    el.style.visibility = "hidden";
  }

  // ---- SNAP / RATIO: plates move on a 40 ms stagger (back-plate leads, content trails) ----
  async function onMove(win, from, to, place) {
    place(win, to);
    const f = build(win.el);
    const st = ctx && ctx.state;
    const opening = st && st.list.some((w) => w !== win && w.el.style.visibility === "hidden");
    const alive = claim(f, "gk");
    if (ctx) {
      claim(seamO, "k");
      ctx.seam.style.opacity = "0";
    }
    measure(win, from, to);
    const DUR = 470;
    const dl = [0, 40, 80, 120];
    const at = (i, e) => {
      const p = P(e, dl[i], DUR, SETTLE);
      return { x: lerp(from.x, to.x, p), w: lerp(from.w, to.w, p) };
    };
    const run = tween(
      DUR + dl[3],
      (e) => {
        const b = at(0, e);
        const s = at(1, e);
        const t = at(2, e);
        const c = at(3, e);
        Object.assign(f.back.style, { left: b.x - to.x + OFF + "px", width: b.w - OFF + "px", right: "auto" });
        Object.assign(f.surf.style, { left: s.x - to.x + "px", width: s.w - OFF + "px", right: "auto" });
        f.tb.style.width = t.w - OFF - 2 + "px";
        f.tb.style.transform = `translateX(${t.x - s.x}px)`;
        f.ct.style.width = c.w - OFF - 2 + "px";
        f.ct.style.transform = `translateX(${c.x - s.x}px)`;
        tele(win, s.w, to.h);
      },
      alive,
    ).then((ok) => {
      if (!ok) return;
      clear([f.back, f.surf], ["left", "width", "right"]);
      clear([f.tb, f.ct], ["width", "transform"]);
      tele(win);
    });
    // when a neighbour is about to open, hand over early so its layers overlap the slide
    if (opening) await Promise.race([run, sleep(270)]);
    else await run;
  }

  // the measuring rail along the top edge: travels with the boundary, readout + chevrons, then wipes away
  function measure(win, from, to) {
    if (!ctx || !ov) return;
    const st = ctx.state;
    if (st.list.length === 2 && win !== st.list[0]) return;
    const leftEdge = from.x !== to.x;
    const two = st.list.length === 2;
    const pad = two && !leftEdge ? GAP / 2 : 0;
    const b0 = (leftEdge ? from.x : from.x + from.w) + pad;
    const b1 = (leftEdge ? to.x : to.x + to.w) + pad;
    if (Math.abs(b1 - b0) < 2) return;
    const dir = b1 > b0 ? 1 : -1;
    const ratio = two ? `${st.ratio[0]} : ${st.ratio[1]}` : "FULL";
    const chev = dir > 0 ? "›››" : "‹‹‹";
    const m = D(
      "ef-meas",
      ov,
      `<div class="mt"></div><div class="ms"></div><div class="mk k0"></div><div class="mk k1"></div>
      <div class="ml${dir < 0 ? " rev" : ""}"><i>${chev}</i><b>${ratio}</b><em></em></div>`,
    );
    const [mt, ms, k0, k1, ml] = m.children;
    const em = ml.querySelector("em");
    tween(1240, (e) => {
      const p = P(e, 40, 470, SETTLE);
      const bx = lerp(b0, b1, p);
      const w = P(e, 820, 280, SNAP);
      const a = lerp(b0, b1, w);
      mt.style.opacity = P(e, 0, 120) * (1 - P(e, 900, 200)) * 0.9;
      ms.style.transform = `translateX(${Math.min(a, bx)}px) scaleX(${Math.abs(bx - a)})`;
      ms.style.opacity = 1 - P(e, 1080, 60);
      k0.style.transform = `translateX(${b0}px)`;
      k0.style.opacity = P(e, 0, 80) * (1 - P(e, 820, 140));
      k1.style.transform = `translateX(${bx}px)`;
      k1.style.opacity = P(e, 0, 80) * (1 - P(e, 1020, 160));
      const lo = P(e, 70, 120) * (1 - P(e, 780, 180));
      ml.style.opacity = lo;
      ml.style.transform = `translateX(${clamp(bx, 110, SW - 110)}px) translateX(-50%) translateY(${(1 - P(e, 70, 240, SETTLE)) * -10}px)`;
      em.textContent = `Δ${dir > 0 ? "+" : "−"}${Math.round(Math.abs(bx - b0))}`;
    }).then(() => m.remove());
  }

  // ---- FOCUS: rail slides down the new window's left edge, diamond fills, brackets snap on ----
  function onFocus(win, prev) {
    if (prev && prev.el && prev.el._ef && prev.el.isConnected) focusOut(prev.el._ef);
    const f = build(win.el);
    if (win.el.dataset.efNew) return; // onOpen choreographs the newcomer
    const alive = claim(f, "fq");
    tween(
      300,
      (e) => {
        f.rail.style.clipPath = `inset(0 0 ${(1 - P(e, 20, 240, SNAP)) * 100}% 0)`;
        f.fill.style.transform = `scale(${P(e, 60, 140, SNAP)})`;
        setBrk(f, P(e, 160, 130, SNAP));
        f.title.style.color = mix(INK3, INK, P(e, 40, 200));
      },
      alive,
    ).then((ok) => ok && clear([f.rail, f.fill, f.title, ...f.brk], ["clipPath", "transform", "color", "opacity"]));
  }
  function focusOut(f) {
    const alive = claim(f, "fq");
    tween(
      220,
      (e) => {
        f.rail.style.clipPath = `inset(0 0 ${P(e, 0, 180, SNAP) * 100}% 0)`;
        f.fill.style.transform = `scale(${1 - P(e, 0, 120, SNAP)})`;
        setBrk(f, 1 - P(e, 0, 110, SNAP), 12);
        f.title.style.color = mix(INK, INK3, P(e, 40, 180));
      },
      alive,
    ).then((ok) => ok && clear([f.rail, f.fill, f.title, ...f.brk], ["clipPath", "transform", "color", "opacity"]));
  }

  // ---- SEAM: steel hairline + data strip + ticks; a yellow segment runs along it on change ----
  function buildSeam(el) {
    if (el.querySelector(".ef-seam")) return;
    let tk = "";
    for (let y = 60; y < SH - 40; y += 60) tk += `<i class="${y % 300 === 0 ? "maj" : ""}" style="top:${y}px"></i>`;
    el.innerHTML = `<div class="ef-seam"><div class="sm-hair"></div><div class="sm-strip a"></div><div class="sm-strip b"></div>
      <div class="sm-ticks">${tk}</div><div class="sm-run"></div><div class="sm-read"><span></span></div></div>`;
  }
  function seamHook(s) {
    const el = s.seam;
    buildSeam(el);
    if (!s.visible) return;
    if (!s.changing) {
      if (!seamO.run) el.style.opacity = "1";
      return;
    }
    const alive = claim(seamO, "k");
    const r = ctx ? ctx.state.ratio : [1, 1];
    const run = el.querySelector(".sm-run");
    const read = el.querySelector(".sm-read");
    read.firstChild.textContent = `${r[0]} : ${r[1]}`;
    const o0 = parseFloat(el.style.opacity || "0");
    seamO.run = true;
    tween(
      1260,
      (e) => {
        el.style.opacity = lerp(o0, 1, P(e, 140, 220));
        const y = lerp(-160, SH + 20, P(e, 180, 760, SETTLE));
        run.style.transform = `translateY(${y}px)`;
        run.style.opacity = 1 - P(e, 820, 160);
        read.style.opacity = P(e, 260, 140) * (1 - P(e, 1000, 240));
        read.style.transform = `translate(-50%, -50%) translateY(${(1 - P(e, 260, 300, SETTLE)) * 12}px)`;
      },
      alive,
    ).then((ok) => {
      if (alive()) seamO.run = false;
      if (ok) el.style.opacity = "1";
    });
  }

  // ---- HUD: layered panels slide in from the right, each over the previous ----
  function hudMarkup(data) {
    const d = new Date();
    const notes = data.notes.slice(0, 3).map((n, i) => {
      const at = n.indexOf(":");
      const src = at > 0 ? n.slice(0, at) : "System";
      const txt = at > 0 ? n.slice(at + 1).trim() : n;
      return card(
        "note",
        `<span class="sq"></span><div class="nb"><div class="src">${esc(src.toUpperCase())}<span>NTF-0${i + 1}</span></div><div class="tx">${esc(txt)}</div></div>`,
      );
    });
    const tray = data.tray
      .map((t, i) => `<span class="ti"><span class="ef-dia${i < 2 || i === 3 ? " on" : ""}"><i></i></span>${esc(t.toUpperCase())}</span>`)
      .join("");
    return `<div class="efh">
      <div class="efh-dim"></div>
      <div class="efh-plate"><div class="efh-dots"></div><div class="efh-prail"></div>
        <div class="ef-micro efh-pm">${micro(["HUD // OVERLAY · L2", `STACK ${data.notes.length + 3} PANELS`, "INPUT: H · ESC · EDGE"])}</div></div>
      <div class="efh-stack">
        ${card(
          "clock",
          `<div class="lab"><span class="ef-dia on"><i></i></span>SYS.TIME <span class="sl">//</span> LOCAL<span class="r">UTC+01 · ${d.getFullYear()}</span></div>
          <div class="time"><span class="echo">${esc(data.time)}</span><span class="dg">${esc(data.time)}</span></div>
          <div class="date"><span>${esc(data.date.replace(",", "").toUpperCase())}</span><span class="strip"></span><span class="ix">CM-DSK</span></div>`,
          `<div class="tri"></div>`,
        )}
        ${card("tray", `<div class="lab">TRAY <span class="sl">//</span> ${data.tray.length} ACTIVE</div><div class="tr">${tray}</div>`)}
        ${notes.join("")}
        ${card("search", `<span class="chev">›››</span><span class="ph">SEARCH <span class="sl">//</span> APPS · FILES · COMMANDS</span><span class="caret"></span>`)}
      </div></div>`;
  }
  function card(kind, inner, pre = "") {
    return `<div class="efh-card ${kind}"><div class="bk"></div><div class="fc"><div class="in">${inner}</div>${pre}</div></div>`;
  }
  function hudParts(hudEl) {
    const root = hudEl.querySelector(".efh");
    if (!root) return null;
    const cards = [...root.querySelectorAll(".efh-card")].map((c) => ({ bk: c.children[0], fc: c.children[1], inn: c.children[1].firstElementChild }));
    return {
      root,
      dim: root.querySelector(".efh-dim"),
      plate: root.querySelector(".efh-plate"),
      cards,
      tri: root.querySelector(".tri"),
      echo: root.querySelector(".echo"),
    };
  }
  function shift(p) {
    if (!ctx) return;
    const v = p ? `translateX(${-2 * p}px)` : "";
    ctx.wins.style.transform = v;
    ctx.seam.style.transform = v;
  }
  async function hudShow(hudEl, data) {
    const alive = claim(hudO, "g");
    hudEl.innerHTML = hudMarkup(data);
    const h = hudParts(hudEl);
    const n = h.cards.length;
    await tween(
      300 + 60 + (n - 1) * 55 + 360,
      (e) => {
        const p = P(e, 0, 380, SETTLE);
        h.plate.style.transform = `translateX(${(1 - p) * 620}px)`;
        h.dim.style.opacity = P(e, 0, 300);
        shift(p);
        h.cards.forEach((c, i) => {
          const s = 70 + i * 55;
          const b = P(e, s, 300, SETTLE);
          c.bk.style.transform = `translateX(${(1 - b) * 170}px)`;
          c.bk.style.opacity = P(e, s, 80);
          const q = P(e, s + 50, 300, SETTLE);
          c.fc.style.transform = `translateX(${(1 - q) * 230}px)`;
          c.fc.style.clipPath = `inset(0 0 0 ${(1 - q) * 100}%)`;
          const ci = P(e, s + 120, 260, SETTLE);
          c.inn.style.opacity = P(e, s + 120, 160);
          c.inn.style.transform = `translateX(${(1 - ci) * 26}px)`;
        });
        h.tri.style.transform = `scaleX(${P(e, 300, 220, SNAP)})`;
        const g = P(e, 220, 420, SETTLE);
        h.echo.style.transform = `translateX(${lerp(26, 3, g)}px) scaleX(1.01)`;
        h.echo.style.opacity = 0.18 * P(e, 220, 120);
      },
      alive,
    );
  }
  async function hudHide(hudEl) {
    const alive = claim(hudO, "g");
    const h = hudParts(hudEl);
    if (!h) return;
    const n = h.cards.length;
    const ST = 28;
    const ps = n * ST + 30;
    const ok = await tween(
      ps + 200,
      (e) => {
        h.cards.forEach((c, i) => {
          const s = (n - 1 - i) * ST; // last in, first out
          c.inn.style.opacity = 1 - P(e, s, 60);
          const q = P(e, s, 150, SNAP);
          c.fc.style.transform = `translateX(${q * 240}px)`;
          c.fc.style.clipPath = `inset(0 0 0 ${q * 100}%)`;
          const b = P(e, s + 35, 150, SNAP);
          c.bk.style.transform = `translateX(${b * 190}px)`;
          c.bk.style.opacity = 1 - P(e, s + 150, 35);
        });
        const p = P(e, ps, 200, SNAP);
        h.plate.style.transform = `translateX(${p * 620}px)`;
        h.dim.style.opacity = 1 - P(e, ps - 60, 240);
        shift(1 - p);
      },
      alive,
    );
    if (ok && alive()) {
      hudEl.innerHTML = "";
      shift(0);
    }
  }

  window.CONCEPT = { gap: GAP, wallpaper, ready, onOpen, onClose, onMove, onFocus, seam: seamHook, hudShow, hudHide };
})();

</script>
<script>
"use strict";
// ---- harness: a fake 1920x1080 side screen; concepts animate the events -------------------
const W = 1920, H = 1080;
const $ = (s, r = document) => r.querySelector(s);
const screen = $("#screen"), wins = $("#wins"), seam = $("#seam"), hud = $("#hud"), wall = $("#wall");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const KINDS = {
  firefox: { title: "Firefox — a long article", body: () => `<div class="ff"><div class="tabs"><div class="tab on">Article</div><div class="tab">Wiki</div><div class="tab">Mail</div></div><div class="url">https://example.org/read</div><div class="page"><div class="h"></div>${lines(14)}</div></div>` },
  discord: { title: "Discord — #general", body: () => `<div class="dc"><div class="side">${'<div class="chan"></div>'.repeat(9)}</div><div class="chat">${msgs(5)}</div></div>` },
  kitty: { title: "kitty — ~", body: () => `<div class="kt">~ ❯ paru -Syu\n:: Synchronizing package databases...\n cachyos-v3 is up to date\n:: Starting full system upgrade...\n there is nothing to do\n~ ❯ █</div>` },
};
function lines(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="line" style="width:${60 + ((i * 37) % 40)}%"></div>`; return s; }
function msgs(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="msg"><div class="av"></div><div class="bub"><div class="line" style="width:22%;height:11px;background:#454a7a"></div><div class="line" style="width:${50 + ((i * 29) % 45)}%"></div></div></div>`; return s; }

const state = { list: [], ratio: [1, 1], focused: null, hud: false, busy: false };
const C = window.CONCEPT || {};
const GAP = C.gap ?? 0;
let nextKind = ["kitty", "firefox", "discord"];

function tiles(n) {
  if (n === 1) return [{ x: 0, y: 0, w: W, h: H }];
  const [a, b] = state.ratio, lw = Math.round((W - GAP) * a / (a + b));
  return [{ x: 0, y: 0, w: lw, h: H }, { x: lw + GAP, y: 0, w: W - lw - GAP, h: H }];
}
function place(win, r) { Object.assign(win.el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" }); win.rect = { ...r }; }
function make(kind) {
  const el = document.createElement("div");
  el.className = "win " + kind;
  el.innerHTML = `<div class="titlebar"><span class="title">${KINDS[kind].title}</span></div><div class="content">${KINDS[kind].body()}</div>`;
  const win = { kind, el, rect: null };
  el.addEventListener("mousedown", () => focus(win));
  wins.appendChild(el);
  return win;
}
function seamState(changing) {
  if (state.list.length !== 2) { seam.style.display = "none"; C.seam?.({ visible: false, seam, changing }); return; }
  const [a, b] = state.list.map((w) => w.rect);
  const x = a.x + a.w, w = b.x - x;
  Object.assign(seam.style, { display: "block", left: x + "px", width: Math.max(w, 0) + "px" });
  C.seam?.({ visible: true, seam, x, w, h: H, changing, left: state.list[0], right: state.list[1] });
}
async function layout(changing) {
  const t = tiles(state.list.length);
  await Promise.all(state.list.map((win, i) => {
    const from = win.rect, to = t[i];
    if (!from) { place(win, to); return null; }
    if (from.x === to.x && from.w === to.w) return null;
    return C.onMove ? C.onMove(win, from, to, place) : (place(win, to), null);
  }));
  seamState(changing);
}
function focus(win) {
  if (!win || state.focused === win) return;
  const prev = state.focused;
  state.list.forEach((w) => w.el.classList.toggle("focused", w === win));
  state.focused = win;
  C.onFocus?.(win, prev);
}
async function run(fn) { if (state.busy) return; state.busy = true; try { await fn(); } finally { state.busy = false; } }
const act = {
  open: () => run(async () => {
    if (state.list.length >= 2) return;
    const kind = nextKind.find((k) => !state.list.some((w) => w.kind === k)) || "kitty";
    const win = make(kind);
    state.list.push(win);
    const t = tiles(state.list.length);
    place(win, t[state.list.length - 1]);
    win.el.style.visibility = "hidden";
    await layout(true);
    win.el.style.visibility = "";
    focus(win);
    await (C.onOpen?.(win) ?? null);
    seamState(false);
  }),
  close: () => run(async () => {
    const win = state.focused; if (!win) return;
    await (C.onClose?.(win) ?? null);
    win.el.remove();
    state.list = state.list.filter((w) => w !== win);
    state.focused = null;
    await layout(true);
    focus(state.list[0]);
    seamState(false);
  }),
  ratio: (r) => run(async () => { state.ratio = r; await layout(true); await sleep(50); seamState(false); }),
  focus: () => { const i = state.list.indexOf(state.focused); focus(state.list[(i + 1) % state.list.length]); },
  // F: the focused window goes fullscreen (others hidden) and back. Concepts may animate it via
  // onFullscreen(win, on, fromRect, toRect, place) -> Promise; default = instant.
  full: () => run(async () => {
    const win = state.focused; if (!win) return;
    const on = !state.full;
    const others = state.list.filter((w) => w !== win);
    const from = { ...win.rect };
    const to = on ? { x: 0, y: 0, w: W, h: H } : tiles(state.list.length)[state.list.indexOf(win)];
    if (on) { state.full = win; seam.style.display = "none"; }
    if (C.onFullscreen) await C.onFullscreen(win, on, from, to, place, others);
    else { place(win, to); others.forEach((o) => { o.el.style.visibility = on ? "hidden" : ""; }); }
    win.el.classList.toggle("fullscreen", on);
    if (!on) { state.full = null; seamState(false); }
  }),
  hud: async (on = !state.hud) => {
    if (on === state.hud) return;
    state.hud = on;
    hud.classList.toggle("on", on);
    if (on) await (C.hudShow?.(hud, hudData()) ?? null); else await (C.hudHide?.(hud) ?? null);
  },
};
function hudData() {
  const d = new Date();
  return {
    time: d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }),
    date: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }),
    tray: ["Discord", "Steam", "KeePassXC", "Wi-Fi", "Volume 40%"],
    notes: ["Discord: Kuri — gg", "Steam: update ready", "Backup: OK 03:25"],
  };
}
document.querySelectorAll("#bar button").forEach((b) => b.addEventListener("click", () => {
  const a = b.dataset.a;
  if (a === "r11") act.ratio([1, 1]); else if (a === "r12") act.ratio([1, 2]); else if (a === "r21") act.ratio([2, 1]); else act[a]();
}));
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "o") act.open(); else if (k === "x") act.close(); else if (k === "1") act.ratio([1, 1]);
  else if (k === "2") act.ratio([1, 2]); else if (k === "3") act.ratio([2, 1]);
  else if (k === "tab") { e.preventDefault(); act.focus(); } else if (k === "f") act.full(); else if (k === "h") act.hud(); else if (k === "escape") act.hud(false);
});
$("#edge").addEventListener("mouseenter", () => act.hud(true));
screen.addEventListener("mouseleave", () => act.hud(false));
hud.addEventListener("mousedown", (e) => { if (e.target === hud) act.hud(false); });
function fit() { const s = Math.min(innerWidth / W, (innerHeight - 64) / H) * 0.98; $("#fit").style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();
C.wallpaper?.(wall);
(async () => {
  for (const k of ["firefox", "discord"]) { const w = make(k); state.list.push(w); }
  nextKind = ["kitty", "firefox", "discord"];
  await layout(false);
  focus(state.list[0]);
  C.ready?.({ state, screen, wins, seam, hud, wall, W, H, sleep });
  // ?auto=hud,close,r12,open,focus - run actions after load (for headless checks / demos)
  const auto = new URLSearchParams(location.search).get("auto");
  for (const a of auto ? auto.split(",") : []) {
    await sleep(300);
    if (a === "r11") await act.ratio([1, 1]); else if (a === "r12") await act.ratio([1, 2]);
    else if (a === "r21") await act.ratio([2, 1]); else if (act[a]) await act[a]();
  }
})();
</script>
