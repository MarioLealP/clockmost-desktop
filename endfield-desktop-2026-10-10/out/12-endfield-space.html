<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 · Endfield II (space)</title>
<style>
  :root { --W: 1920; --H: 1080; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 64px 0; overflow: hidden; }
  #fit { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #screen { position: absolute; inset: 0; overflow: hidden; border-radius: 6px; background: #111; }
  #wall { position: absolute; inset: 0; }
  #wins { position: absolute; inset: 0; }
  #seam { position: absolute; top: 0; width: 0; height: 100%; pointer-events: none; display: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud.on { pointer-events: auto; }
  #edge { position: absolute; left: 0; right: 0; top: 0; height: 10px; z-index: 50; }
  #felt-note { position: absolute; right: 12px; bottom: 8px; font-size: 12px; opacity: .35; }
  .win { position: absolute; display: flex; flex-direction: column; overflow: hidden; background: #1b1c22; }
  .win .titlebar { height: 34px; flex: none; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #aab; background: #15161b; user-select: none; }
  .win .content { flex: 1; position: relative; overflow: hidden; }
  /* fake app bodies (neutral; concepts may restyle) */
  .ff .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #1f2027; }
  .ff .tab { padding: 6px 14px; background: #2a2b33; border-radius: 6px 6px 0 0; font-size: 12px; color: #bbb; }
  .ff .tab.on { background: #34353e; color: #eee; }
  .ff .url { margin: 6px 8px; height: 30px; border-radius: 6px; background: #2a2b33; display: flex; align-items: center; padding: 0 12px; color: #889; font-size: 12px; }
  .ff .page { padding: 24px 48px; }
  .ff .h { height: 22px; width: 55%; background: #3a3c48; border-radius: 4px; margin-bottom: 18px; }
  .line { height: 10px; background: #2c2e38; border-radius: 3px; margin: 9px 0; }
  .dc { display: flex; height: 100%; }
  .dc .side { width: 220px; background: #17181d; padding: 14px 10px; }
  .dc .chan { height: 18px; margin: 10px 4px; border-radius: 4px; background: #23252c; }
  .dc .chat { flex: 1; padding: 18px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; }
  .dc .msg { display: flex; gap: 12px; }
  .dc .av { width: 38px; height: 38px; border-radius: 50%; background: #3b3f6a; flex: none; }
  .dc .bub { flex: 1; }
  .kt { background: #0f1014; height: 100%; padding: 16px 18px; font: 13px ui-monospace, monospace; color: #9fb; white-space: pre; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 8px; align-items: center; padding: 0 14px; background: #121217; border-top: 1px solid #22232b; }
  #bar button { background: #22242c; color: #ddd; border: 1px solid #31333d; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #2c2e38; }
  #bar .sep { width: 1px; height: 28px; background: #2a2b33; margin: 0 4px; }
  #bar .about { margin-left: auto; font-size: 12px; color: #889; max-width: 520px; text-align: right; }
  kbd { font: 11px ui-monospace, monospace; background: #2c2e38; border-radius: 3px; padding: 1px 4px; }
/* ---- 12 · Endfield II (space) ------------------------------------------------------------ */
#screen {
  --g: #0f0f10; --s1: #17181a; --s2: #1e2024; --well: #0a0a0b; --ln: #33363c; --ln2: #4a4e56;
  --i1: #f0f0f2; --i2: #a8abb2; --i3: #6c6f76; --i4: #44474d;
  --y: #fffa00; --cy: #00ffa2; --mg: #ff1aac; --or: #ff7a1a; --red: #d91e36;
  --glow: 0 0 0.55rem rgba(255, 250, 0, 0.4);
  --disp: Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif;
  --body: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  --ch16: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  --ch15: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
  --ch10: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  --hatch: repeating-linear-gradient(135deg, rgba(74, 78, 86, 0.55) 0 1px, transparent 1px 6px);
  --barcode: repeating-linear-gradient(90deg, var(--ln2) 0 3px, transparent 3px 5px, var(--ln) 5px 6px, transparent 6px 11px, var(--i4) 11px 13px, transparent 13px 18px);
  background: #060607; border-radius: 0;
}
#screen s { display: inline-block; width: 14px; height: 1px; margin: 0 4px; vertical-align: middle; background: currentColor; opacity: 0.5; text-decoration: none; }

/* ---- the static floor (outside the camera) ---- */
#wall { background: #060607; }
.e2-floor { position: absolute; inset: 0; width: 100%; height: 100%; }
.e2-wgrain { position: absolute; inset: 0; background: var(--grain); opacity: 0.045; }
.e2-wcr { position: absolute; }
.e2-wcr.bl { left: 6px; bottom: -14px; }
.e2-wcr.tr { right: -20px; top: -40px; opacity: 0.8; }
.e2-wprint > * { position: absolute; }
.e2-wprint .wm { left: 70px; top: 7px; font: 300 14px var(--disp); letter-spacing: 0.62em; color: #8a8d94; }
.e2-wprint .rl { left: 270px; top: 15px; width: 640px; height: 1px; background: var(--ln); }
.e2-wprint .lb { font: 9px var(--mono); letter-spacing: 0.14em; color: var(--i4); white-space: nowrap; }
.e2-wprint .lb.t { right: 70px; top: 10px; }
.e2-wprint .bc { left: 330px; bottom: 15px; width: 150px; height: 8px; background: var(--barcode); opacity: 0.8; }
.e2-wprint .hb { left: 496px; bottom: 13px; width: 44px; height: 12px; background: repeating-linear-gradient(135deg, var(--i3) 0 2px, transparent 2px 6px); opacity: 0.7; }
.e2-wprint .lb.b { left: 556px; bottom: 14px; }
.e2-wprint .rr { right: 70px; bottom: 19px; width: 420px; height: 1px; background: var(--ln); }
.e2-wprint .lb.r { right: 520px; bottom: 14px; }
.e2-wprint .bc.r { left: auto; right: 70px; bottom: 26px; width: 90px; height: 5px; }

/* ---- world layers (the camera moves these) ---- */
#wins, #seam, .ef-ov, .e2-wp { will-change: transform; }
.ef-ov { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
#seam { z-index: 2; }
.e2-dim { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 80% 70% at 40% 60%, rgba(5, 5, 6, 0.8), rgba(3, 3, 4, 0.9)); }
.e2-wp { position: absolute; inset: 0; z-index: 4; pointer-events: none; transform-style: preserve-3d; }
#hud { z-index: 5; }

/* ---- windows: back-plate · surface (edge + face) · rail · brackets ---- */
.win { background: transparent; overflow: visible; display: block; }
.ef-back { position: absolute; left: 8px; top: 8px; right: 0; bottom: 0; clip-path: var(--ch16); background: var(--hatch), rgba(30, 32, 36, 0.78); }
.ef-surf { position: absolute; left: 0; top: 0; right: 8px; bottom: 8px; }
.ef-edge { position: absolute; inset: 0; background: var(--ln); clip-path: var(--ch16); }
.win.focused .ef-edge { background: var(--ln2); }
.ef-face { position: absolute; inset: 1px; clip-path: var(--ch15); background: var(--s1); display: flex; flex-direction: column; overflow: hidden; }
.win .titlebar { height: 36px; flex: none; gap: 12px; padding: 0 16px 0 20px; background: var(--s2); border-bottom: 1px solid var(--ln); color: var(--i3); }
.win .title { font: 600 13px var(--disp); letter-spacing: 0.16em; text-transform: uppercase; color: var(--i3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win.focused .title { color: var(--i1); }
.ef-tele { margin-left: auto; font: 10px var(--mono); letter-spacing: 0.1em; color: var(--i4); white-space: nowrap; }
.ef-tele b { font-weight: 400; color: var(--i4); margin-left: 4px; }
.win.focused .ef-tele { color: var(--i3); }
.win.focused .ef-tele b { color: rgba(255, 250, 0, 0.7); }
.ef-dia { position: relative; flex: none; display: inline-block; width: 9px; height: 9px; border: 2px solid var(--i3); transform: rotate(45deg); }
.ef-dia i { position: absolute; inset: -2px; background: var(--y); box-shadow: var(--glow); transform: scale(0); }
.win.focused .ef-dia { border-color: var(--y); }
.win.focused .ef-dia i { transform: scale(1); }
.ef-frail { position: absolute; left: 1px; top: 1px; width: 3px; height: calc(100% - 44px); pointer-events: none;
  background: linear-gradient(var(--y), var(--y)) 0 0 / 3px 36px no-repeat, linear-gradient(180deg, rgba(255, 250, 0, 0.5), rgba(255, 250, 0, 0) 55%) 0 36px / 1px 100% no-repeat;
  clip-path: inset(0 0 100% 0); }
.win.focused .ef-frail { clip-path: inset(0); }
.ef-brk { position: absolute; width: 14px; height: 14px; border: 2px solid rgba(255, 250, 0, 0.55); opacity: 0; pointer-events: none; }
.ef-brk.tl { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.ef-brk.br { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.win.focused .ef-brk { opacity: 1; }
.win .content { flex: 1; }

/* ---- notification diamond (rule 7): orange, dark outline, the one calm looping pulse ---- */
.nd { position: absolute; width: 18px; height: 18px; pointer-events: none; }
.nd b { position: absolute; inset: 1px; background: var(--or); border: 2px solid #3a1a04; transform: rotate(45deg); box-shadow: 0 0 0 1px rgba(255, 122, 26, 0.55); }
.nd::after { content: ""; position: absolute; inset: 1px; border: 2px solid var(--or); transform: rotate(45deg); opacity: 0; }
.nd.live::after { animation: e2-nd 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
@keyframes e2-nd {
  0% { transform: rotate(45deg) scale(1); opacity: 0.95; }
  12% { opacity: 0.25; }
  20% { opacity: 0.9; }
  75%, 100% { transform: rotate(45deg) scale(2.3); opacity: 0; }
}
/* rule 11: crimson timer tag */
.tt { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; background: var(--red); color: #fff;
  font: 700 12px/16px var(--body); letter-spacing: 0.02em; clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  transform: rotate(-2deg); }

/* ---- app skins ---- */
.ff .tabs { position: relative; z-index: 2; height: 48px; justify-content: center; align-items: flex-start; gap: 10px; padding: 9px 0 0;
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 8px), linear-gradient(180deg, #26282c, #1c1e21);
  border-bottom: 1px solid var(--ln); overflow: visible; }
.ff .tab { position: relative; border-radius: 6px; background: #2a2d32; border: 1px solid #3e4148; color: var(--i3); padding: 7px 22px;
  font: 600 12px var(--disp); letter-spacing: 0.14em; text-transform: uppercase; }
.ff .tab.on { background: var(--topo) center / 260px 180px, var(--y); border-color: transparent; color: #141414; padding: 9px 30px 18px; margin-bottom: -16px;
  border-radius: 5px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45); }
.ff .tab:nth-child(3)::before { content: ""; position: absolute; right: -7px; top: -6px; width: 11px; height: 11px; background: var(--or); border: 2px solid #3a1a04; transform: rotate(45deg); }
.ff .tab:nth-child(3)::after { content: ""; position: absolute; right: -7px; top: -6px; width: 11px; height: 11px; border: 2px solid var(--or); transform: rotate(45deg); opacity: 0;
  animation: e2-nd 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.ff .url { margin: 18px 10px 8px; height: 30px; border-radius: 0; background: var(--well); border: 1px solid var(--ln); color: var(--i3); font: 12px var(--mono); letter-spacing: 0.04em; }
.ff .page { padding: 28px 52px; }
.ff .h { border-radius: 0; background: #34373e; }
.line { border-radius: 0; background: #25272c; }
.dc .side { background: #131416; border-right: 1px solid var(--ln); padding: 16px 12px; }
.dc .chan { position: relative; background: transparent; border-radius: 0; margin: 12px 4px; }
.dc .chan::before { content: ""; position: absolute; left: 4px; top: 5px; width: 6px; height: 6px; border: 1.5px solid var(--i4); transform: rotate(45deg); }
.dc .chan::after { content: ""; position: absolute; left: 22px; top: 5px; height: 8px; width: 62%; background: #2a2d33; }
.dc .chan:nth-child(3n)::after { width: 44%; }
.dc .chan:nth-child(3) { background: rgba(255, 250, 0, 0.04); box-shadow: inset 2px 0 0 var(--y); }
.dc .chan:nth-child(3)::before { background: var(--y); border-color: var(--y); box-shadow: var(--glow); }
.dc .chan:nth-child(3)::after { background: #5a5e66; }
.dc .chan:nth-child(6)::before, .dc .chan:nth-child(8)::before { left: 2px; top: 3px; width: 9px; height: 9px; border: 1.5px solid #3a1a04; background: var(--or); box-shadow: 0 0 0 1px rgba(255, 122, 26, 0.5); }
.dc .chan:nth-child(6)::after, .dc .chan:nth-child(8)::after { background: #6c6f76; }
.dc .av { border-radius: 0; background: #2a2d33; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.dc .bub .line:first-child { background: #4a4e56 !important; }
.kt { position: relative; background: var(--well); color: var(--i2); font: 13px/20px var(--mono); padding: 16px 20px; }
.kt::before { content: ""; position: absolute; left: 0; top: 116px; width: 3px; height: 20px; background: var(--y); }
.kt::after { content: ""; position: absolute; left: 3px; right: 0; top: 116px; height: 20px; background: linear-gradient(90deg, rgba(255, 250, 0, 0.06), transparent 40%); }

/* ---- measuring rail ---- */
.ef-meas > * { position: absolute; left: 0; top: 0; }
.ef-meas .mt { width: 100%; height: 1px; top: 1px; background: var(--ln2); opacity: 0; }
.ef-meas .ms { width: 1px; height: 3px; background: var(--y); box-shadow: var(--glow); transform-origin: 0 0; }
.ef-meas .mk { width: 1px; height: 30px; margin-left: -0.5px; }
.ef-meas .k0 { background: var(--ln2); }
.ef-meas .k1 { background: var(--y); width: 2px; margin-left: -1px; }
.ef-meas .ml { top: 46px; display: flex; align-items: center; gap: 10px; white-space: nowrap; padding: 6px 12px 6px 14px;
  background: rgba(10, 10, 11, 0.94); border: 1px solid var(--ln2); box-shadow: inset 3px 0 0 var(--y); font: 14px var(--mono); color: var(--i1); clip-path: var(--ch10); opacity: 0; }
.ef-meas .ml b { font-weight: 700; letter-spacing: 0.08em; }
.ef-meas .ml i { font-style: normal; color: var(--y); letter-spacing: -0.1em; order: 3; }
.ef-meas .ml.rev i { order: 0; }
.ef-meas .ml em { font-style: normal; color: var(--i3); font-size: 12px; }

/* ---- seam ---- */
.ef-seam { position: absolute; inset: 0; overflow: visible; }
.sm-hair { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ln); }
.sm-strip { position: absolute; left: calc(50% - 2px); width: 4px; height: 150px; opacity: 0.8;
  background: repeating-linear-gradient(180deg, var(--ln2) 0 3px, transparent 3px 5px, var(--ln) 5px 6px, transparent 6px 11px, var(--i4) 11px 13px, transparent 13px 18px); }
.sm-strip.a { top: 48px; }
.sm-strip.b { bottom: 48px; }
.sm-ticks i { position: absolute; left: calc(50% - 3px); width: 7px; height: 1px; background: var(--ln2); }
.sm-ticks i.maj { left: calc(50% - 5px); width: 11px; background: var(--i3); }
.sm-run { position: absolute; left: calc(50% - 1px); top: 0; width: 3px; height: 140px; opacity: 0; background: linear-gradient(180deg, rgba(255, 250, 0, 0), var(--y)); box-shadow: var(--glow); }
.sm-read { position: absolute; left: 50%; top: 50%; opacity: 0; transform: translate(-50%, -50%); white-space: nowrap; padding: 6px 10px;
  background: rgba(10, 10, 11, 0.95); border: 1px solid var(--ln2); box-shadow: inset 0 2px 0 var(--y); font: 700 13px var(--mono); letter-spacing: 0.08em; color: var(--i1); }

/* ---- fullscreen mosaic: 5 x 7 grid ---- */
.e2-mz { position: absolute; inset: 0; opacity: 0; }
.e2-mz .c { position: absolute; border: 1px solid rgba(74, 78, 86, 0.9); }
.e2-mz .c i { position: absolute; left: 6px; top: 4px; font: 9px var(--mono); font-style: normal; letter-spacing: 0.1em; color: var(--i3); }

/* ---- rule 10: the layer stack (HUD world print + fullscreen moment) ---- */
.ls, .ls .l { position: absolute; }
.ls { inset: 0; }
.ls .topo { left: 0; top: 760px; width: 1340px; height: 320px; background: var(--topoL);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 45%); mask-image: linear-gradient(180deg, transparent, #000 45%); }
.ls .tex { inset: 0; }
.ls .sq { position: absolute; font-style: normal; }
.ls .sq.dots { left: 70px; top: 620px; width: 120px; height: 96px; background: radial-gradient(rgba(255, 250, 0, 0.55) 1.4px, transparent 1.8px) 0 0 / 14px 14px; }
.ls .sq.dots.b { left: 1190px; top: 860px; background: radial-gradient(rgba(240, 240, 242, 0.25) 1.2px, transparent 1.6px) 0 0 / 12px 12px; }
.ls .sq.hat { left: 960px; top: 150px; width: 270px; height: 34px; background: repeating-linear-gradient(135deg, rgba(240, 240, 242, 0.16) 0 6px, transparent 6px 14px); }
.ls .sq.hat.b { left: 40px; top: 520px; width: 380px; height: 22px; top: 548px; }
.ls .sq.bin { left: 230px; top: 690px; font: 13px/1.35 var(--mono); letter-spacing: 0.2em; color: rgba(240, 240, 242, 0.12); white-space: nowrap; }
.ls .sq.bin.b { left: 1200px; top: 300px; }
.ls .sq.brk { left: 300px; top: 880px; width: 90px; height: 90px; border-left: 12px solid rgba(240, 240, 242, 0.1); border-bottom: 12px solid rgba(240, 240, 242, 0.1); }
.ls .sq.chev { left: 1060px; top: 590px; font: 700 230px/1 var(--disp); color: transparent; -webkit-text-stroke: 2px rgba(240, 240, 242, 0.12); letter-spacing: -0.12em; }
.ls .white { left: 0; top: 596px; width: 1340px; height: 8px; display: flex; gap: 10px; }
.ls .white i { height: 100%; background: rgba(240, 240, 242, 0.42); flex: 3; }
.ls .white i + i { flex: 1; background: rgba(240, 240, 242, 0.18); }
.ls .banner { left: 520px; top: 60px; width: 230px; height: 1020px; background: linear-gradient(180deg, rgba(204, 198, 34, 0.62), rgba(170, 165, 30, 0.5));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 130px), calc(100% - 130px) 100%, 0 100%); }
.ls .banner span { position: absolute; left: 16px; bottom: 150px; font: 9px/1.5 var(--mono); letter-spacing: 0.14em; color: rgba(20, 20, 10, 0.75); }
.ls .banner b { position: absolute; left: 62px; top: 30px; font: 26px/1 var(--body); color: rgba(244, 244, 246, 0.9); }
.ls .banner b.d { top: 760px; }
.ls .logo { left: 495px; top: 160px; width: 280px; height: 280px; filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5)); }
.ls .tri { left: 0; top: 524px; width: 1340px; height: 9px;
  background: linear-gradient(90deg, var(--y) 0 74%, transparent 74% 75%, var(--cy) 75% 88%, transparent 88% 89%, var(--mg) 89% 100%); }
.ls .tri .lab { position: absolute; left: 560px; top: -6px; padding: 0 12px; height: 21px; background: #111; color: var(--y); font: italic 700 14px/21px var(--disp); letter-spacing: 0.18em; white-space: nowrap; }
.ls .red { left: 700px; top: 476px; width: 640px; height: 40px; background: #e8381f; display: flex; align-items: center; }
.ls .red .tx { padding-left: 130px; font: italic 700 25px var(--disp); letter-spacing: 0.04em; color: #fff; white-space: nowrap; }
.ls .red .ring { position: absolute; left: 24px; top: -26px; width: 92px; height: 92px; }
.ls .blue { left: 860px; top: 446px; width: 480px; height: 10px; background: linear-gradient(90deg, rgba(47, 107, 255, 0), rgba(47, 107, 255, 0.9) 35%), repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.3) 0 2px, transparent 2px 8px); }
/* the fullscreen moment: same stack, thinner and centred, over the mosaic */
.e2-fsx { position: absolute; inset: 0; pointer-events: none; }
.e2-fsx .ls .topo { left: 0; top: 760px; width: 1920px; opacity: 0.5; }
.e2-fsx .ls .tex { opacity: 0.8; }
.e2-fsx .ls .white { top: 470px; width: 1920px; height: 4px; }
.e2-fsx .ls .banner { left: 1460px; top: 0; height: 1080px; width: 160px; opacity: 0.55; }
.e2-fsx .ls .logo { left: 1400px; top: 380px; width: 200px; height: 200px; }
.e2-fsx .ls .tri { top: 536px; width: 1920px; height: 7px; }
.e2-fsx .ls .tri .lab { left: 880px; }
.e2-fsx .ls .red { left: 0; top: 590px; width: 760px; }
.e2-fsx .ls .blue { left: 1100px; top: 610px; width: 820px; }

/* ---- rule 9: world print - floor numeral, angled info plates (in the world, not facing the camera) ---- */
.e2w { position: absolute; inset: 0; transform-style: preserve-3d; }
.e2w .floor { position: absolute; left: 30px; top: 560px; width: 1100px; height: 560px; transform-origin: 50% 100%;

<script>

        const hi = Math.max(a, b, c, d);

          pt[2] = x0 + cell;

          pt[4] = x0 + (cell * (L - d)) / (c - d || 1e-9);

          pt[6] = x0;

    c.height = h;

  // ---- rule 8: the black floor with reflective contour lines (rendered once) ----
  function floorCanvas() {
    const c = canvas(SW, SH);
    const g = c.getContext("2d");
    g.fillStyle = "#060607";
    g.fillRect(0, 0, SW, SH);

      g.stroke(p);
    });

    g.lineWidth = 1.15;
    glow.forEach((p, i) => {

    });

      [1180, 260, 120, 26, 0.32],
      [690, 610, 70, 15, 0.16],
    ].forEach(([x, y, rx, ry, a]) => {
      g.save();

  function grainTexture(a) {
    const c = canvas(220, 220);
    const g = c.getContext("2d");
    const d = g.createImageData(220, 220);
    const r = rng(99);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = r() * 255;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = a;
    }
    g.putImageData(d, 0, 0);
    return c.toDataURL();
  }

  // ---- rule 5: faceted amber crystals with glowing glyphs, heavy grain (rendered once) ----
  const GLYPHS = [
    [[0, 0, 0.72, 0.17], [0, 0, 0.18, 1], [0, 0.83, 1, 0.17], [0.52, 0.42, 0.48, 0.17], [0.82, 0.42, 0.18, 0.58]],
    [[0.2, 0, 0.6, 0.15], [0, 0.15, 0.2, 0.3], [0.8, 0.15, 0.2, 0.3], [0.22, 0.44, 0.56, 0.13], [0, 0.57, 0.2, 0.3], [0.8, 0.57, 0.2, 0.3], [0.2, 0.86, 0.6, 0.14]],
    [[0, 0, 1, 0.16], [0.42, 0.16, 0.16, 0.48], [0, 0.64, 0.46, 0.16], [0.54, 0.64, 0.46, 0.16], [0.12, 0.8, 0.16, 0.2], [0.72, 0.8, 0.16, 0.2]],
    [[0, 0.1, 0.16, 0.8], [0.16, 0, 0.5, 0.16], [0.5, 0.16, 0.16, 0.34], [0.16, 0.5, 0.84, 0.16], [0.84, 0.66, 0.16, 0.34]],
  ];
  function rot3(v, ax, ay, az) {
    let [x, y, z] = v;
    let c = Math.cos(ax);
    let s = Math.sin(ax);
    [y, z] = [y * c - z * s, y * s + z * c];
    c = Math.cos(ay);
    s = Math.sin(ay);
    [x, z] = [x * c + z * s, -x * s + z * c];
    c = Math.cos(az);
    s = Math.sin(az);
    [x, y] = [x * c - y * s, x * s + y * c];
    return [x, y, z];
  }
  function drawCrystal(g, cx, cy, r, seed, glyph, dim = 1) {
    const R = rng(seed);
    const n = 10 + Math.floor(R() * 4);
    const step = (Math.PI * 2) / n;
    const ring = (y, rad, off) => Array.from({ length: n }, (_, i) => {
      const a = i * step + off + (R() - 0.5) * 0.18;
      const rr = rad * (0.86 + R() * 0.28);
      return [Math.cos(a) * rr, y + (R() - 0.5) * 0.08, Math.sin(a) * rr];
    });
    const top = [(R() - 0.5) * 0.2, -1.2, (R() - 0.5) * 0.2];
    const bot = [(R() - 0.5) * 0.2, 1.1, (R() - 0.5) * 0.2];
    const r1 = ring(-0.62, 0.62, 0);
    const r2 = ring(-0.08, 1, step / 2);
    const r3 = ring(0.5, 0.84, 0);
    const r4 = ring(0.84, 0.42, step / 2);
    const faces = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      faces.push([top, r1[i], r1[j]]);
      faces.push([r1[i], r1[j], r2[i]], [r2[i], r2[j], r1[j]]);
      faces.push([r2[i], r2[j], r3[j]], [r3[i], r3[j], r2[i]]);
      faces.push([r3[i], r3[j], r4[i]], [r4[i], r4[j], r3[j]]);
      faces.push([r4[i], r4[j], bot]);
    }
    const ax = 0.35 + R() * 0.5;
    const ay = R() * 6.28;
    const az = (R() - 0.5) * 0.9;
    const T = new Map();
    const tv = (v) => {
      if (!T.has(v)) T.set(v, rot3(v, ax, ay, az));
      return T.get(v);
    };
    const proj = (v) => {
      const k = 4 / (4 + v[2]);
      return [cx + v[0] * r * k, cy + v[1] * r * k];
    };
    const L = (() => {
      const l = [-0.45, -0.75, -0.5];
      const m = Math.hypot(...l);
      return l.map((x) => x / m);
    })();
    const fs = faces.map((f) => {
      const [a, b, c] = f.map(tv);
      const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      const w = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      let nn = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
      const cen = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3];
      if (nn[0] * cen[0] + nn[1] * cen[1] + nn[2] * cen[2] < 0) nn = nn.map((x) => -x);
      const m = Math.hypot(...nn) || 1;
      nn = nn.map((x) => x / m);
      return { pts: [a, b, c].map(proj), z: cen[2], nn };
    });
    fs.sort((p, q) => q.z - p.z);
    const poly = (pts) => {
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
      g.closePath();
    };
    // ambient amber pool under / around it
    const am = g.createRadialGradient(cx, cy + r * 0.2, r * 0.1, cx, cy + r * 0.2, r * 1.9);
    am.addColorStop(0, `rgba(255,170,30,${0.22 * dim})`);
    am.addColorStop(1, "rgba(255,170,30,0)");
    g.fillStyle = am;
    g.fillRect(cx - r * 2, cy - r * 2, r * 4, r * 4);
    // back faces: the amber interior seen through the stone
    for (const f of fs)
      if (f.nn[2] > 0) {
        const d = clamp(-(f.nn[0] * L[0] + f.nn[1] * L[1] + f.nn[2] * L[2]) * 0.5 + 0.5);
        poly(f.pts);
        g.fillStyle = `hsla(${36 + d * 8},95%,${(10 + d * 22) * dim}%,0.95)`;
        g.fill();
      }
    // inner glow + glyph
    const ig = g.createRadialGradient(cx, cy, 0, cx, cy, r * 0.95);
    ig.addColorStop(0, `rgba(255,214,60,${0.55 * dim})`);
    ig.addColorStop(1, "rgba(255,170,20,0)");
    g.fillStyle = ig;
    g.fillRect(cx - r, cy - r, r * 2, r * 2);
    const glyphDraw = (alpha, blur) => {
      g.save();
      g.translate(cx, cy);
      g.rotate(az * 0.6);
      g.transform(1, 0, Math.sin(ay) * 0.25, 1, 0, 0);
      const gs = r * 0.74;
      g.translate(-gs / 2, -gs / 2);
      g.shadowColor = "rgba(255,236,60,1)";
      g.shadowBlur = blur;
      g.fillStyle = `rgba(255,${246 + 9 * dim},${120 + 80 * dim},${alpha})`;
      for (const [x, y, w, h] of GLYPHS[glyph % GLYPHS.length]) g.fillRect(x * gs, y * gs, w * gs, h * gs);
      g.restore();
    };
    glyphDraw(0.9 * dim + 0.1, r * 0.35);
    // front faces: translucent amber, lambert + specular, faint ridge edges
    for (const f of fs)
      if (f.nn[2] <= 0) {
        const d = clamp(-(f.nn[0] * L[0] + f.nn[1] * L[1] + f.nn[2] * L[2]));
        const sp = Math.pow(d, 7);
        poly(f.pts);
        g.fillStyle = `hsla(${38 + d * 12},${96 - sp * 30}%,${(8 + d * 58 + sp * 30) * dim}%,${0.4 + d * 0.25 + sp * 0.3})`;
        g.fill();
        g.strokeStyle = `hsla(50,100%,${(60 + d * 30) * dim}%,${0.05 + sp * 0.5})`;
        g.lineWidth = 0.8;
        g.stroke();
      }
    // the glyph glows through the front facets
    g.globalCompositeOperation = "lighter";
    glyphDraw(0.45 * dim, r * 0.5);
    g.globalCompositeOperation = "source-over";
  }
  function crystalCanvas(w, h, items, grain = 44) {
    const c = canvas(w, h);
    const g = c.getContext("2d");
    for (const it of items) drawCrystal(g, it[0], it[1], it[2], it[3], it[4], it[5] ?? 1);
    // heavy film grain, baked in once
    const d = g.getImageData(0, 0, w, h);
    const R = rng(5);
    for (let i = 0; i < d.data.length; i += 4) {
      if (d.data[i + 3] < 4) continue;
      const n = (R() - 0.5) * grain * 2;
      d.data[i] = clamp(d.data[i] + n, 0, 255);
      d.data[i + 1] = clamp(d.data[i + 1] + n, 0, 255);
      d.data[i + 2] = clamp(d.data[i + 2] + n * 0.7, 0, 255);
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  // ---- rule 2: the camera. One world transform on #wins, #seam, the overlay and the world print ----
  const C = { fx: 960, fy: 540, rx: 0, ry: 0, s: 1, ty: 0, bs: 0, brx: 0, bry: 0, px: 960, py: 540 };
  function frame(o = {}) {
    const st = ctx ? ctx.state : null;
    const hud = o.hud ?? (st ? st.hud : false);
    const full = o.full ?? !!(st && st.full);
    if (hud) return { fx: 760, fy: 620, rx: 1.4, ry: -2.2, s: 0.955, ty: -4 };
    if (full) return { fx: 960, fy: 540, rx: 0, ry: 0, s: 1, ty: 0 };
    const f = o.win || (st && st.focused);
    const n = st ? st.list.length : 0;
    if (!f || !f.rect) return { fx: 960, fy: 540, rx: 0.3, ry: 0, s: 0.935, ty: -8 };
    const r = f.rect;
    const fx = r.x + r.w / 2;
    return { fx, fy: 540, rx: 0.3, ry: n === 2 ? (fx < 960 ? 1 : -1) * 1.1 : 0, s: 0.935, ty: -8 };
  }
  function world() {
    let t = `translate(960px,${f4(540 + C.ty)}px) scale(${f4(C.s + C.bs)}) translate(-960px,-540px) translate(${f4(C.fx)}px,${f4(C.fy)}px) rotateX(${f4(C.rx)}deg) rotateY(${f4(C.ry)}deg) translate(${f4(-C.fx)}px,${f4(-C.fy)}px)`;
    if (Math.abs(C.brx) > 1e-4 || Math.abs(C.bry) > 1e-4)
      t += ` translate(${f4(C.px)}px,${f4(C.py)}px) rotateX(${f4(C.brx)}deg) rotateY(${f4(C.bry)}deg) translate(${f4(-C.px)}px,${f4(-C.py)}px)`;
    return t;
  }
  function apply() {
    if (!ctx) return;
    const t = world();
    ctx.wins.style.transform = t;
    ov.style.transform = t;
    const sl = parseFloat(ctx.seam.style.left) || 0;
    ctx.seam.style.transformOrigin = `${-sl}px 0`;
    ctx.seam.style.transform = t;
    // world print floats a little in front of the windows: parallax under rotation
    const z = 70;
    wp.style.transform = `${t} translate(960px,540px) translateZ(${z}px) scale(${f4((PERS - z) / PERS)}) translate(-960px,-540px)`;
  }
  function cam(to, o = {}) {
    if (!ctx) return Promise.resolve();
    const alive = claim(camO, "k");
    const dur = o.dur ?? 1050;
    const from = { ...C };
    const piv = o.pivot || { x: to.fx, y: to.fy };
    return tween(
      dur,
      (e) => {
        const p = P(e, 0, dur, SETTLE);
        const b = Math.sin(Math.PI * P(e, 0, dur, SETTLE));
        for (const k of ["fx", "fy", "rx", "ry", "s", "ty"]) C[k] = lerp(from[k], to[k], p);
        C.bs = lerp(from.bs, 0, p) + (o.bs ?? -0.012) * b;
        C.brx = lerp(from.brx, 0, p) + (o.brx ?? 0) * b;
        C.bry = lerp(from.bry, 0, p) + (o.bry ?? 0) * b;
        C.px = lerp(from.px, piv.x, P(e, 0, 200, SETTLE));
        C.py = lerp(from.py, piv.y, P(e, 0, 200, SETTLE));
        apply();
      },
      alive,
    );
  }
  const center = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

  // ---- window structure: back-plate · surface (edge + face{titlebar, content}) · rail · brackets ----
  function build(el) {
    if (el._ef) return el._ef;
    const tb = el.querySelector(".titlebar");
    const ct = el.querySelector(".content");
    const title = tb.querySelector(".title");
    const back = D("ef-back");
    const surf = D("ef-surf");
    D("ef-edge", surf);
    const face = D("ef-face", surf);
    face.append(tb, ct);
    const rail = D("ef-frail", surf);
    const brk = [D("ef-brk tl", surf), D("ef-brk br", surf)];
    el.prepend(back, surf);
    const dia = document.createElement("span");
    dia.className = "ef-dia";
    dia.innerHTML = "<i></i>";
    tb.insertBefore(dia, title);
    const tele = document.createElement("span");
    tele.className = "ef-tele";
    tb.appendChild(tele);
    const n = ++winCount;
    el._ef = { back, surf, face, tb, ct, title, dia, fill: dia.firstChild, tele, rail, brk, n };
    return el._ef;
  }
  function tele(win, w, h) {
    const f = build(win.el);
    const r = win.rect || { w: 0, h: 0 };
    f.tele.innerHTML = `WIN-${String(f.n).padStart(2, "0")} <s></s> ${Math.round(w ?? r.w)}×${Math.round(h ?? r.h)} <s></s> WS-02 <b>▸▸▸</b>`;
  }

  // ---- wallpaper: static floor + grain + corner crystals + small print (outside the camera) ----
  function micro(lines) {
    return lines.map(esc).join("<br>");
  }
  function wallpaper(wallEl) {
    const screen = wallEl.parentNode;
    topoURL = topoTexture();
    grainURL = grainTexture(255);
    screen.style.setProperty("--topo", `url(${topoURL})`);
    screen.style.setProperty("--grain", `url(${grainURL})`);
    screen.style.setProperty("--topoL", `url(${topoTexture("rgba(232,234,240,0.34)", 41, 1340, 320)})`);
    screen.style.perspective = `${PERS}px`;
    ov = D("ef-ov");
    dimEl = D("e2-dim");
    wp = D("e2-wp");
    const hudEl = screen.querySelector("#hud");
    screen.insertBefore(ov, hudEl);
    screen.insertBefore(dimEl, hudEl);
    screen.insertBefore(wp, hudEl);
    const fl = floorCanvas();
    fl.className = "e2-floor";
    const cr1 = crystalCanvas(560, 300, [
      [150, 170, 70, 11, 1, 0.9],
      [300, 205, 52, 4, 0, 0.8],
      [70, 250, 40, 8, 2, 0.6],
    ]);
    cr1.className = "e2-wcr bl";
    const cr2 = crystalCanvas(360, 220, [
      [230, 90, 48, 31, 3, 0.75],
      [110, 150, 34, 17, 1, 0.55],
    ]);
    cr2.className = "e2-wcr tr";
    wallEl.append(fl);
    D("e2-wgrain", wallEl);
    wallEl.append(cr1, cr2);
    D(
      "e2-wprint",
      wallEl,
      `<div class="wm">CLOCKMOST</div><div class="rl"></div><div class="lb t">SIDE DISPLAY <s></s> 1920×1080 <s></s> EF-12 / SPACE</div>
      <div class="bc"></div><div class="hb"></div><div class="lb b">NODE CLOCKMOST.COM <s></s> TANG OK <s></s> VAULT OK <s></s> SEC.62</div>
      <div class="rr"></div><div class="lb r">▸▸▸ SNAP 1,0,.7,1 <s></s> SETTLE .16,1,.3,1</div><div class="bc r"></div>`,
    );
    // structure windows the moment the harness creates them (before first paint)
    new MutationObserver((ms) => {
      for (const m of ms)
        for (const n of m.addedNodes) {
          if (!(n instanceof HTMLElement) || !n.classList.contains("win") || n.dataset.ghost) continue;
          build(n);
          if (ctx) n.dataset.efNew = "1";
        }
    }).observe(screen.querySelector("#wins"), { childList: true });
  }

  function ready(c) {
    ctx = c;
    c.state.list.forEach((w) => tele(w));
    ["wins", "seam"].forEach((k) => (c[k].style.transformOrigin = "0 0"));
    ov.style.transformOrigin = wp.style.transformOrigin = "0 0";
    Object.assign(C, frame());
    apply();
  }

  // ---- OPEN (rule 3): the whole stack appears at once ~46px low at low opacity, then fades + slides home;
  // rule 4: brackets, rail, telemetry, title fade in slowly after it lands ----
  async function onOpen(win) {
    const el = win.el;
    const f = build(el);
    tele(win);
    const alive = claim(f, "gk");
    claim(f, "fq");
    const c = center(win.rect);
    cam(frame({ win }), { pivot: c, bry: (c.x < 960 ? 1 : -1) * 1.6, bs: -0.014 });
    const ok = await tween(
      1250,
      (e) => {
        const p = P(e, 0, 640, SETTLE);
        el.style.opacity = lerp(0.14, 1, P(e, 0, 520, SETTLE));
        el.style.transform = `translateY(${(1 - p) * 46}px)`;
        const pb = P(e, 0, 820, SETTLE);
        f.back.style.transform = `translate(${(1 - pb) * -12}px, ${(1 - pb) * 20}px)`;
        const pc = P(e, 60, 700, SETTLE);
        f.ct.style.transform = `translateY(${(1 - pc) * 16}px)`;
        f.ct.style.opacity = lerp(0.25, 1, P(e, 60, 560));
        const s = P(e, 420, 800, SOFT);
        f.tele.style.opacity = s;
        f.rail.style.opacity = s;
        f.fill.style.opacity = s;
        f.brk.forEach((b) => (b.style.opacity = s));
        f.title.style.opacity = lerp(0.2, 1, P(e, 300, 760, SOFT));
        f.title.style.color = mix(INK3, INK, P(e, 300, 600));
      },
      alive,
    );
    if (ok) clear([el, f.back, f.ct, f.tele, f.rail, f.fill, f.title, ...f.brk], ["opacity", "transform", "color"]);
    delete el.dataset.efNew;
  }

  // ---- CLOSE: small parts drop first, then the stack fades + sinks the short distance (SNAP) ----
  async function onClose(win) {
    const el = win.el;
    const f = build(el);
    const alive = claim(f, "gk");
    claim(f, "fq");
    const seam = ctx && ctx.seam;
    if (seam) {
      claim(seamO, "k");
      const o0 = parseFloat(seam.style.opacity || "1");
      tween(160, (e) => (seam.style.opacity = o0 * (1 - P(e, 0, 160))));
    }
    await tween(
      360,
      (e) => {
        const s = 1 - P(e, 0, 110);
        f.tele.style.opacity = f.rail.style.opacity = f.fill.style.opacity = s;
        f.brk.forEach((b) => (b.style.opacity = s));
        const c = P(e, 30, 160, SNAP);
        f.ct.style.opacity = 1 - c;
        f.ct.style.transform = `translateY(${c * 14}px)`;
        const p = P(e, 80, 280, SNAP);
        el.style.opacity = 1 - p;
        el.style.transform = `translateY(${p * 34}px)`;
        f.back.style.transform = `translate(${P(e, 40, 240, SNAP) * 10}px, ${P(e, 40, 240, SNAP) * 22}px)`;
      },
      alive,
    );
    el.style.visibility = "hidden";
  }

  // ---- SNAP / RATIO: plates move on a 40 ms stagger; the camera swings around the moving boundary ----
  async function onMove(win, from, to, place) {
    place(win, to);
    const f = build(win.el);
    const st = ctx && ctx.state;
    const opening = st && st.list.some((w) => w !== win && w.el.style.visibility === "hidden");
    const alive = claim(f, "gk");
    if (ctx) {
      claim(seamO, "k");
      ctx.seam.style.opacity = "0";
    }
    measure(win, from, to);
    if (st && st.list.length === 2 && win === st.list[0] && !opening) {
      const bx = to.x + to.w + GAP / 2;
      const dir = to.w > from.w ? 1 : -1;
      Promise.resolve().then(() => cam(frame(), { pivot: { x: bx, y: 540 }, bry: dir * 2.2, brx: 0.6, bs: -0.016, dur: 1100 }));
    }
    const DUR = 470;
    const dl = [0, 40, 80, 120];
    const at = (i, e) => {
      const p = P(e, dl[i], DUR, SETTLE);
      return { x: lerp(from.x, to.x, p), w: lerp(from.w, to.w, p) };
    };
    const run = tween(
      DUR + dl[3],
      (e) => {
        const b = at(0, e);
        const s = at(1, e);
        const t = at(2, e);
        const c = at(3, e);
        Object.assign(f.back.style, { left: b.x - to.x + OFF + "px", width: b.w - OFF + "px", right: "auto" });
        Object.assign(f.surf.style, { left: s.x - to.x + "px", width: s.w - OFF + "px", right: "auto" });
        f.tb.style.width = t.w - OFF - 2 + "px";
        f.tb.style.transform = `translateX(${t.x - s.x}px)`;
        f.ct.style.width = c.w - OFF - 2 + "px";
        f.ct.style.transform = `translateX(${c.x - s.x}px)`;
        tele(win, s.w, to.h);
      },
      alive,
    ).then((ok) => {
      if (!ok) return;
      clear([f.back, f.surf], ["left", "width", "right"]);
      clear([f.tb, f.ct], ["width", "transform"]);
      tele(win);
    });
    if (opening) await Promise.race([run, sleep(270)]);
    else await run;
  }

  // the measuring rail along the top edge: travels with the boundary, readout + chevrons, then wipes away
  function measure(win, from, to) {
    if (!ctx || !ov) return;
    const st = ctx.state;
    if (st.list.length === 2 && win !== st.list[0]) return;
    const leftEdge = from.x !== to.x;
    const two = st.list.length === 2;
    const pad = two && !leftEdge ? GAP / 2 : 0;
    const b0 = (leftEdge ? from.x : from.x + from.w) + pad;
    const b1 = (leftEdge ? to.x : to.x + to.w) + pad;
    if (Math.abs(b1 - b0) < 2) return;
    const dir = b1 > b0 ? 1 : -1;
    const ratio = two ? `${st.ratio[0]} : ${st.ratio[1]}` : "FULL";
    const chev = dir > 0 ? "›››" : "‹‹‹";
    const m = D(
      "ef-meas",
      ov,
      `<div class="mt"></div><div class="ms"></div><div class="mk k0"></div><div class="mk k1"></div>
      <div class="ml${dir < 0 ? " rev" : ""}"><i>${chev}</i><b>${ratio}</b><em></em></div>`,
    );
    const [mt, ms, k0, k1, ml] = m.children;
    const em = ml.querySelector("em");
    tween(1240, (e) => {
      const p = P(e, 40, 470, SETTLE);
      const bx = lerp(b0, b1, p);
      const w = P(e, 820, 280, SNAP);
      const a = lerp(b0, b1, w);
      mt.style.opacity = P(e, 0, 120) * (1 - P(e, 900, 200)) * 0.9;
      ms.style.transform = `translateX(${Math.min(a, bx)}px) scaleX(${Math.abs(bx - a)})`;
      ms.style.opacity = 1 - P(e, 1080, 60);

      k0.style.opacity = P(e, 0, 80) * (1 - P(e, 820, 140));
      k1.style.transform = `translateX(${bx}px)`;
      k1.style.opacity = P(e, 0, 80) * (1 - P(e, 1020, 160));

  // ---- FOCUS: the camera turns to the new focal window; rail / diamond / brackets follow, quiet ----
  function onFocus(win, prev) {
    if (prev && prev.el && prev.el._ef && prev.el.isConnected) focusOut(prev.el._ef);
    const f = build(win.el);
    if (win.el.dataset.efNew) return; // onOpen choreographs the newcomer
    if (ctx && !ctx.state.full && !ctx.state.hud && win.rect) {
      const c = center(win.rect);
      cam(frame({ win }), { pivot: c, bry: (c.x < 960 ? 1 : -1) * 1.8, bs: -0.016, dur: 1100 });
    }
    const alive = claim(f, "fq");
    tween(
      760,
      (e) => {
        f.rail.style.clipPath = `inset(0 0 ${(1 - P(e, 40, 300, SNAP)) * 100}% 0)`;
        f.fill.style.transform = `scale(${P(e, 80, 160, SNAP)})`;
        const s = P(e, 160, 600, SOFT);
        f.brk.forEach((b) => (b.style.opacity = s));
        f.title.style.color = mix(INK3, INK, P(e, 60, 300));
      },
      alive,
    ).then((ok) => ok && clear([f.rail, f.fill, f.title, ...f.brk], ["clipPath", "transform", "color", "opacity"]));
  }
  function focusOut(f) {
    const alive = claim(f, "fq");
    tween(
      360,
      (e) => {
        f.rail.style.clipPath = `inset(0 0 ${P(e, 0, 200, SNAP) * 100}% 0)`;
        f.fill.style.transform = `scale(${1 - P(e, 0, 140, SNAP)})`;
        f.brk.forEach((b) => (b.style.opacity = 1 - P(e, 0, 300, SOFT)));
        f.title.style.color = mix(INK, INK3, P(e, 40, 260));
      },
      alive,
    ).then((ok) => ok && clear([f.rail, f.fill, f.title, ...f.brk], ["clipPath", "transform", "color", "opacity"]));
  }

  // ---- FULLSCREEN (rule 1): a 5 x 7 tile mosaic; tiles cut over to the new content in random order ----
  function tileRect(i) {
    const c = i % COLS;
    const r = Math.floor(i / COLS);
    const w = SW / COLS;
    const h = SH / ROWS;
    return { x: c * w, y: r * h, w, h };
  }
  function shuffle(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // q in [0,1]: how much of tile i is cut over; dir picks the cut's slide direction
  function tilePart(i, q, dir) {
    const t = tileRect(i);
    const b = 0.6;
    if (q <= 0) return "";
    let { x, y, w, h } = t;
    if (dir === 0) w *= q;
    else if (dir === 1) (x += w * (1 - q)), (w *= q);
    else if (dir === 2) h *= q;
    else (y += h * (1 - q)), (h *= q);
    x -= b;
    y -= b;
    w += 2 * b;
    h += 2 * b;
    return `M${x.toFixed(1)} ${y.toFixed(1)}h${w.toFixed(1)}v${h.toFixed(1)}h${(-w).toFixed(1)}Z`;
  }
  async function mosaic(target, reveal, name) {
    // reveal: target shows only the cut tiles (in); else target shows only the uncut tiles (out)
    const order = shuffle(COLS * ROWS);
    const dirs = order.map(() => Math.floor(Math.random() * 4));
    const ST = 27;
    const TD = 120;
    const grid = D("e2-mz", ov);
    const fsx = D("e2-fsx", ov, stackMarkup(`${reveal ? "EXPAND" : "RESTORE"} · ${name}`, reveal ? "-FULLSCREEN-" : "-SPLIT-"));
    const sp = stackParts(fsx);
    const cells = order.map((_, i) => {
      const t = tileRect(i);
      const c = D("c", grid, `<i>${String(i + 1).padStart(2, "0")}</i>`);
      Object.assign(c.style, { left: t.x + "px", top: t.y + "px", width: t.w + "px", height: t.h + "px" });
      return c;
    });
    const at = new Array(COLS * ROWS);
    order.forEach((tile, k) => (at[tile] = 90 + k * ST));
    const total = 90 + (COLS * ROWS - 1) * ST + TD + 420;
    target.style.clipPath = reveal ? "path('M0 0Z')" : "";
    await tween(total, (e) => {
      grid.style.opacity = P(e, 0, 90) * (1 - P(e, total - 380, 380, SOFT));
      if (e < total - 470) stackIn(sp, e, 0, 460);
      else stackOut(sp, e, total - 470);
      let path = "";
      for (let i = 0; i < COLS * ROWS; i++) {
        const q = P(e, at[i], TD, SNAP);
        if (reveal) path += tilePart(i, q, dirs[i]);
        else if (q < 1) path += tilePart(i, 1 - q, dirs[i] ^ 1);
        const fl = P(e, at[i], 40) * (1 - P(e, at[i] + 70, 300, SETTLE));
        const c = cells[i];
        c.style.opacity = 0.5 + 0.5 * fl;
        c.style.borderColor = fl > 0.02 ? `rgba(255,250,0,${(0.25 + 0.75 * fl).toFixed(3)})` : "";
        c.style.backgroundColor = fl > 0.02 ? `rgba(255,250,0,${(0.07 * fl).toFixed(3)})` : "";
      }
      target.style.clipPath = `path('${path || "M0 0Z"}')`;
    });
    grid.remove();
    fsx.remove();
    target.style.clipPath = "";
  }
  async function onFullscreen(win, on, from, to, place, others) {
    const f = build(win.el);
    claim(f, "gk");
    if (on) {
      // the old split frame stays underneath (a still copy) until every tile has cut over
      const under = win.el.cloneNode(true);
      under.dataset.ghost = "1";
      under.style.pointerEvents = "none";
      ctx.wins.insertBefore(under, ctx.wins.firstChild);
      win.el.style.zIndex = "3";
      place(win, to);
      tele(win);
      cam(frame({ full: true }), { pivot: center(from), bry: (center(from).x < 960 ? 1 : -1) * 1.4, bs: -0.01, dur: 1300 });
      await mosaic(win.el, true, win.kind.toUpperCase());
      under.remove();
      others.forEach((o) => (o.el.style.visibility = "hidden"));
    } else {
      const ghost = win.el.cloneNode(true);
      ghost.dataset.ghost = "1";
      ghost.style.zIndex = "4";
      ghost.style.pointerEvents = "none";
      ctx.wins.appendChild(ghost);
      place(win, to);
      tele(win);
      win.el.style.zIndex = "";
      others.forEach((o) => (o.el.style.visibility = ""));
      cam(frame({ full: false, win }), { pivot: center(to), bry: (center(to).x < 960 ? -1 : 1) * 1.4, bs: -0.01, dur: 1300 });
      await mosaic(ghost, false, win.kind.toUpperCase());
      ghost.remove();
    }
  }

  // ---- SEAM: steel hairline + data strip + ticks; a yellow segment runs along it on change ----
  function buildSeam(el) {

  // ---- rule 10: deep layer stacks. Bottom -> top: topo lines, texture squares, white stripe, yellow banner,

  // per-layer entry: [delay, dx, dy] - every layer appears at once, offset + faint, then fades/slides home
  const LS_IN = { topo: [0, 0, 34], tex: [60, 0, 26], white: [110, -44, 0], banner: [30, 0, -56], logo: [190, 0, 26], tri: [250, 52, 0], red: [310, -48, 0], blue: [370, 44, 0] };
  function stackParts(root) {

  function stackIn(parts, e, base = 0, dur = 640) {
    parts.forEach(({ el, k, ring }) => {
      const p = P(e, base + k[0], dur, SETTLE);
      el.style.opacity = lerp(0.1, 1, p);
      el.style.transform = `translate(${(1 - p) * k[1]}px, ${(1 - p) * k[2]}px)`;

  }
  function stackOut(parts, e, base = 0) {
    const n = parts.length;
    parts.forEach(({ el, k }, i) => {

  // rule 11: crimson timer tag

        smalls.forEach((s, i) => (s.style.opacity = P(e, 520 + (i % 6) * 50, 760, SOFT)));
      },
      alive,
    );
    if (alive()) smalls.forEach((s) => (s.style.opacity = ""));
  }
  async function hudHide(hudEl) {
    const alive = claim(hudO, "g");
    const h = hudParts(hudEl);
    if (!h) return;
    cam(frame({ hud: false }), { pivot: { x: 760, y: 640 }, bry: 1.2, brx: -0.8, bs: -0.01, dur: 1000 });
    const ok = await tween(
      380,
      (e) => {
        h.smalls.forEach((s) => (s.style.opacity = 1 - P(e, 0, 110)));
        const q = (d) => P(e, d, 220, SNAP);
        h.col.forEach((c, i) => {
          const p = q((h.col.length - 1 - i) * 22);
          c.style.opacity = 1 - p;
          c.style.transform = `translateY(${p * -26}px)`;
        });
        h.tabs.forEach((t) => {
          const p = q(90);
          t.style.opacity = 1 - p;
          t.style.transform = `translate(-50%, ${p * -24}px)`;
        });
        const pb = q(120);
        h.band.style.opacity = 1 - pb;
        h.band.style.transform = `translateY(${pb * -24}px)`;
        const pw = q(40);
        h.floor.style.opacity = h.clockp.style.opacity = h.crp.style.opacity = 1 - pw;
        stackOut(h.stack, e, 20);
        h.floor.style.setProperty("--in", `${pw * 40}px`);
        h.clockp.style.setProperty("--in", `${pw * -36}px`);
        h.crp.style.setProperty("--in", `${pw * -36}px`);
        dimEl.style.opacity = 1 - P(e, 100, 280, SETTLE);
      },
      alive,
    );
    if (ok && alive()) {
      hudEl.innerHTML = "";
      wp.innerHTML = "";
      dimEl.style.opacity = 0;
    }
  }

  window.CONCEPT = { gap: GAP, wallpaper, ready, onOpen, onClose, onMove, onFocus, onFullscreen, seam: seamHook, hudShow, hudHide };
})();

<script>
"use strict";
// ---- harness: a fake 1920x1080 side screen; concepts animate the events -------------------
const W = 1920, H = 1080;
const $ = (s, r = document) => r.querySelector(s);
const screen = $("#screen"), wins = $("#wins"), seam = $("#seam"), hud = $("#hud"), wall = $("#wall");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const KINDS = {
  firefox: { title: "Firefox — a long article", body: () => `<div class="ff"><div class="tabs"><div class="tab on">Article</div><div class="tab">Wiki</div><div class="tab">Mail</div></div><div class="url">https://example.org/read</div><div class="page"><div class="h"></div>${lines(14)}</div></div>` },
  discord: { title: "Discord — #general", body: () => `<div class="dc"><div class="side">${'<div class="chan"></div>'.repeat(9)}</div><div class="chat">${msgs(5)}</div></div>` },
  kitty: { title: "kitty — ~", body: () => `<div class="kt">~ ❯ paru -Syu\n:: Synchronizing package databases...\n cachyos-v3 is up to date\n:: Starting full system upgrade...\n there is nothing to do\n~ ❯ █</div>` },
};
function lines(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="line" style="width:${60 + ((i * 37) % 40)}%"></div>`; return s; }
function msgs(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="msg"><div class="av"></div><div class="bub"><div class="line" style="width:22%;height:11px;background:#454a7a"></div><div class="line" style="width:${50 + ((i * 29) % 45)}%"></div></div></div>`; return s; }

const state = { list: [], ratio: [1, 1], focused: null, hud: false, busy: false };
const C = window.CONCEPT || {};
const GAP = C.gap ?? 0;
let nextKind = ["kitty", "firefox", "discord"];

function tiles(n) {
  if (n === 1) return [{ x: 0, y: 0, w: W, h: H }];
  const [a, b] = state.ratio, lw = Math.round((W - GAP) * a / (a + b));
  return [{ x: 0, y: 0, w: lw, h: H }, { x: lw + GAP, y: 0, w: W - lw - GAP, h: H }];
}
function place(win, r) { Object.assign(win.el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" }); win.rect = { ...r }; }
function make(kind) {
  const el = document.createElement("div");
  el.className = "win " + kind;
  el.innerHTML = `<div class="titlebar"><span class="title">${KINDS[kind].title}</span></div><div class="content">${KINDS[kind].body()}</div>`;
  const win = { kind, el, rect: null };
  el.addEventListener("mousedown", () => focus(win));
  wins.appendChild(el);
  return win;
}
function seamState(changing) {
  if (state.list.length !== 2) { seam.style.display = "none"; C.seam?.({ visible: false, seam, changing }); return; }
  const [a, b] = state.list.map((w) => w.rect);
  const x = a.x + a.w, w = b.x - x;
  Object.assign(seam.style, { display: "block", left: x + "px", width: Math.max(w, 0) + "px" });
  C.seam?.({ visible: true, seam, x, w, h: H, changing, left: state.list[0], right: state.list[1] });
}
async function layout(changing) {
  const t = tiles(state.list.length);
  await Promise.all(state.list.map((win, i) => {
    const from = win.rect, to = t[i];
    if (!from) { place(win, to); return null; }
    if (from.x === to.x && from.w === to.w) return null;
    return C.onMove ? C.onMove(win, from, to, place) : (place(win, to), null);
  }));
  seamState(changing);
}
function focus(win) {
  if (!win || state.focused === win) return;
  const prev = state.focused;
  state.list.forEach((w) => w.el.classList.toggle("focused", w === win));
  state.focused = win;
  C.onFocus?.(win, prev);
}
async function run(fn) { if (state.busy) return; state.busy = true; try { await fn(); } finally { state.busy = false; } }
const act = {
  open: () => run(async () => {
    if (state.list.length >= 2) return;
    const kind = nextKind.find((k) => !state.list.some((w) => w.kind === k)) || "kitty";
    const win = make(kind);
    state.list.push(win);
    const t = tiles(state.list.length);
    place(win, t[state.list.length - 1]);
    win.el.style.visibility = "hidden";
    await layout(true);
    win.el.style.visibility = "";
    focus(win);
    await (C.onOpen?.(win) ?? null);
    seamState(false);
  }),
  close: () => run(async () => {
    const win = state.focused; if (!win) return;
    await (C.onClose?.(win) ?? null);
    win.el.remove();
    state.list = state.list.filter((w) => w !== win);
    state.focused = null;
    await layout(true);
    focus(state.list[0]);
    seamState(false);
  }),
  ratio: (r) => run(async () => { state.ratio = r; await layout(true); await sleep(50); seamState(false); }),
  focus: () => { const i = state.list.indexOf(state.focused); focus(state.list[(i + 1) % state.list.length]); },
  // F: the focused window goes fullscreen (others hidden) and back. Concepts may animate it via
  // onFullscreen(win, on, fromRect, toRect, place) -> Promise; default = instant.
  full: () => run(async () => {
    const win = state.focused; if (!win) return;
    const on = !state.full;
    const others = state.list.filter((w) => w !== win);
    const from = { ...win.rect };
    const to = on ? { x: 0, y: 0, w: W, h: H } : tiles(state.list.length)[state.list.indexOf(win)];
    if (on) { state.full = win; seam.style.display = "none"; }
    if (C.onFullscreen) await C.onFullscreen(win, on, from, to, place, others);
    else { place(win, to); others.forEach((o) => { o.el.style.visibility = on ? "hidden" : ""; }); }
    win.el.classList.toggle("fullscreen", on);
    if (!on) { state.full = null; seamState(false); }
  }),
  hud: async (on = !state.hud) => {
    if (on === state.hud) return;
    state.hud = on;
    hud.classList.toggle("on", on);
    if (on) await (C.hudShow?.(hud, hudData()) ?? null); else await (C.hudHide?.(hud) ?? null);
  },
};
function hudData() {
  const d = new Date();
  return {
    time: d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }),
    date: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }),
    tray: ["Discord", "Steam", "KeePassXC", "Wi-Fi", "Volume 40%"],
    notes: ["Discord: Kuri — gg", "Steam: update ready", "Backup: OK 03:25"],
  };
}
document.querySelectorAll("#bar button").forEach((b) => b.addEventListener("click", () => {
  const a = b.dataset.a;
  if (a === "r11") act.ratio([1, 1]); else if (a === "r12") act.ratio([1, 2]); else if (a === "r21") act.ratio([2, 1]); else act[a]();
}));
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "o") act.open(); else if (k === "x") act.close(); else if (k === "1") act.ratio([1, 1]);
  else if (k === "2") act.ratio([1, 2]); else if (k === "3") act.ratio([2, 1]);
  else if (k === "tab") { e.preventDefault(); act.focus(); } else if (k === "f") act.full(); else if (k === "h") act.hud(); else if (k === "escape") act.hud(false);
});
$("#edge").addEventListener("mouseenter", () => act.hud(true));
screen.addEventListener("mouseleave", () => act.hud(false));
hud.addEventListener("mousedown", (e) => { if (e.target === hud) act.hud(false); });
function fit() { const s = Math.min(innerWidth / W, (innerHeight - 64) / H) * 0.98; $("#fit").style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();
C.wallpaper?.(wall);
(async () => {
  for (const k of ["firefox", "discord"]) { const w = make(k); state.list.push(w); }
  nextKind = ["kitty", "firefox", "discord"];
  await layout(false);
  focus(state.list[0]);
  C.ready?.({ state, screen, wins, seam, hud, wall, W, H, sleep });
  // ?auto=hud,close,r12,open,focus - run actions after load (for headless checks / demos)
  const auto = new URLSearchParams(location.search).get("auto");
  for (const a of auto ? auto.split(",") : []) {
    await sleep(300);
    if (a === "r11") await act.ratio([1, 1]); else if (a === "r12") await act.ratio([1, 2]);
    else if (a === "r21") await act.ratio([2, 1]); else if (act[a]) await act[a]();
  }
})();
</script>
