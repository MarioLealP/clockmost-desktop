<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 · Drafting table (blueprint)</title>
<style>
  :root { --W: 1920; --H: 1080; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 64px 0; overflow: hidden; }
  #fit { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #screen { position: absolute; inset: 0; overflow: hidden; border-radius: 6px; background: #111; }
  #wall { position: absolute; inset: 0; }
  #wins { position: absolute; inset: 0; }
  #seam { position: absolute; top: 0; width: 0; height: 100%; pointer-events: none; display: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud.on { pointer-events: auto; }
  #edge { position: absolute; left: 0; right: 0; top: 0; height: 10px; z-index: 50; }
  #felt-note { position: absolute; right: 12px; bottom: 8px; font-size: 12px; opacity: .35; }
  .win { position: absolute; display: flex; flex-direction: column; overflow: hidden; background: #1b1c22; }
  .win .titlebar { height: 34px; flex: none; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #aab; background: #15161b; user-select: none; }
  .win .content { flex: 1; position: relative; overflow: hidden; }
  /* fake app bodies (neutral; concepts may restyle) */
  .ff .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #1f2027; }
  .ff .tab { padding: 6px 14px; background: #2a2b33; border-radius: 6px 6px 0 0; font-size: 12px; color: #bbb; }
  .ff .tab.on { background: #34353e; color: #eee; }
  .ff .url { margin: 6px 8px; height: 30px; border-radius: 6px; background: #2a2b33; display: flex; align-items: center; padding: 0 12px; color: #889; font-size: 12px; }
  .ff .page { padding: 24px 48px; }
  .ff .h { height: 22px; width: 55%; background: #3a3c48; border-radius: 4px; margin-bottom: 18px; }
  .line { height: 10px; background: #2c2e38; border-radius: 3px; margin: 9px 0; }
  .dc { display: flex; height: 100%; }
  .dc .side { width: 220px; background: #17181d; padding: 14px 10px; }
  .dc .chan { height: 18px; margin: 10px 4px; border-radius: 4px; background: #23252c; }
  .dc .chat { flex: 1; padding: 18px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; }
  .dc .msg { display: flex; gap: 12px; }
  .dc .av { width: 38px; height: 38px; border-radius: 50%; background: #3b3f6a; flex: none; }
  .dc .bub { flex: 1; }
  .kt { background: #0f1014; height: 100%; padding: 16px 18px; font: 13px ui-monospace, monospace; color: #9fb; white-space: pre; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 8px; align-items: center; padding: 0 14px; background: #121217; border-top: 1px solid #22232b; }
  #bar button { background: #22242c; color: #ddd; border: 1px solid #31333d; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #2c2e38; }
  #bar .sep { width: 1px; height: 28px; background: #2a2b33; margin: 0 4px; }
  #bar .about { margin-left: auto; font-size: 12px; color: #889; max-width: 520px; text-align: right; }
  kbd { font: 11px ui-monospace, monospace; background: #2c2e38; border-radius: 3px; padding: 1px 4px; }
/* ---- 3 · Drafting table (blueprint) ---------------------------------------------------- */
#screen {
  --ink: #a9e2ff;
  --ink-dim: rgba(169, 226, 255, 0.45);
  --acc: #ffb547;
  --pencil: #33495c;
  --paper: #0b1d2e;
  --dr-font: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
  --dr-mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
  background: var(--paper);
}

/* wallpaper: blueprint grid + slowly drifting construction marks */
#wall {
  background:
    linear-gradient(rgba(140, 200, 255, 0.1) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg, rgba(140, 200, 255, 0.1) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(rgba(140, 200, 255, 0.04) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(140, 200, 255, 0.04) 1px, transparent 1px) 0 0 / 24px 24px,
    radial-gradient(ellipse at 42% 36%, #12324d, #0a1b2c 68%, #07131f);
}
#wall .dr-marks { position: absolute; inset: 0; width: 100%; height: 100%; }
#wall .dr-marks * { vector-effect: non-scaling-stroke; }
#wall .dr-drift { animation: dr-drift 90s ease-in-out infinite alternate; }
#wall .dr-spin { transform-box: fill-box; transform-origin: center; animation: dr-spin 240s linear infinite; }
#wall .mk { fill: none; stroke: rgba(169, 226, 255, 0.16); stroke-width: 1; }
#wall .mk.cl { stroke-dasharray: 18 6 3 6; }
#wall .mk.dt { stroke-dasharray: 2 7; }
#wall .mk-t { fill: rgba(169, 226, 255, 0.24); font: 13px var(--dr-mono); letter-spacing: 0.1em; }
#wall .dr-walltag { position: absolute; left: 28px; bottom: 22px; font: 600 11px var(--dr-font); letter-spacing: 0.3em; color: rgba(169, 226, 255, 0.28); }
@keyframes dr-drift { to { transform: translate(-46px, 22px); } }
@keyframes dr-spin { to { transform: rotate(360deg); } }

/* windows: lightly tinted, technical lettering in the title bar */
.win { background: #111a24; }
.win .titlebar {
  justify-content: space-between; background: #0e1721; color: #9cb6cb;
  font: 500 12px var(--dr-font); letter-spacing: 0.12em; text-transform: uppercase;
  border-bottom: 1px solid rgba(169, 226, 255, 0.12);
}
.win .dr-dim-tag { font: 11px var(--dr-mono); letter-spacing: 0.04em; color: #4e7491; text-transform: none; }
.win::after {
  content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
  border: 1px solid var(--pencil); transition: border-color 0.18s ease-out;
}
.win.focused::after { border-color: var(--acc); transition: border-color 0.14s ease-out 0.12s; }
.win::before {
  --m: 16px; --t: 2px; --c: var(--acc);
  content: ""; position: absolute; inset: 5px; z-index: 7; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) left top / var(--m) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) left top / var(--t) var(--m) no-repeat,
    linear-gradient(var(--c), var(--c)) right top / var(--m) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) right top / var(--t) var(--m) no-repeat,
    linear-gradient(var(--c), var(--c)) left bottom / var(--m) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) left bottom / var(--t) var(--m) no-repeat,
    linear-gradient(var(--c), var(--c)) right bottom / var(--m) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) right bottom / var(--t) var(--m) no-repeat;
  opacity: 0; transform: scale(1.025); transition: opacity 0.2s ease-out, transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.win.focused::before { opacity: 1; transform: none; }
.win.dr-drawing::after, .win.dr-drawing::before { opacity: 0; transition: none; }
.ff .tabs { background: #152030; }
.ff .tab { background: #1c2939; }
.ff .tab.on { background: #283a4e; }
.ff .url { background: #1c2939; }
.ff .h { background: #34495e; }
.line { background: #233243; }
.dc .side { background: #0f1822; }
.dc .chan { background: #1b2734; }
.kt { background: #0b131c; }

/* overlay (construction / dimensions / eraser) */
.dr-ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.dr-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dr-con { stroke: var(--ink); stroke-width: 1.3; }
.dr-tip { fill: #fff; }
.dr-flash { fill: #eaf7ff; font: 300 46px var(--dr-font); letter-spacing: 0.06em; text-anchor: middle; dominant-baseline: middle; filter: drop-shadow(0 0 10px rgba(169, 226, 255, 0.55)); }
.dr-dim line { stroke: var(--ink); stroke-width: 1; }
.dr-dim .lab rect { fill: var(--paper); stroke: var(--ink-dim); stroke-width: 1; }
.dr-dim .lab text { fill: var(--ink); font: 13px var(--dr-mono); text-anchor: middle; dominant-baseline: central; letter-spacing: 0.04em; }
.dr-ext { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 10 5 2 5; opacity: 0.8; }
.dr-ghost line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 6 6; }
.dr-ghost text { fill: var(--ink); opacity: 0.6; font: 13px var(--dr-mono); text-anchor: middle; }
.dr-trace path { fill: none; stroke: #ffe2a8; stroke-width: 2; }
.dr-eraser {
  position: absolute; left: 0; top: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(214, 236, 250, 0.05) 25%, rgba(225, 240, 252, 0.16) 47%, rgba(240, 248, 255, 0.24) 52%, rgba(214, 236, 250, 0.07) 72%, transparent);
  backdrop-filter: blur(5px) brightness(1.12);
}
.dr-erase-box { position: absolute; overflow: hidden; pointer-events: none; }
.dr-crumb { position: absolute; left: 0; top: 0; width: 5px; height: 3px; border-radius: 1px; background: #cfe3f1; pointer-events: none; }

/* seam: a calm vertical dimension line between the two windows */
.dr-seam { position: absolute; left: 0; top: 0; overflow: visible; }
.dr-seam .sm-ln, .dr-seam .sm-tk { stroke: var(--ink-dim); stroke-width: 1; fill: none; transition: stroke 0.3s; }
.dr-seam .sm-ar { fill: var(--ink-dim); transition: fill 0.3s; }
.dr-seam-lab {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  padding: 7px 3px; background: var(--paper); border: 1px solid var(--ink-dim); white-space: nowrap;
  font: 12px var(--dr-mono); color: var(--ink); letter-spacing: 0.02em; transition: color 0.3s, border-color 0.3s;
}
#seam.dr-chg .dr-seam-lab { color: var(--acc); border-color: var(--acc); }
#seam.dr-chg .sm-ln, #seam.dr-chg .sm-tk { stroke: var(--ink); }
#seam.dr-chg .sm-ar { fill: var(--ink); }

/* HUD: a sheet frame + title block */
.dr-hud { position: absolute; inset: 0; }
.dr-hud .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dr-hud .fr { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0.75; transition: stroke-dashoffset 0.5s cubic-bezier(0.3, 0.7, 0.2, 1); }
.dr-hud .dr-tb { position: absolute; right: 30px; bottom: 30px; width: 640px; height: 340px; transform: translateX(36px); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.dr-hud .dr-tb svg { position: absolute; inset: 0; overflow: visible; }
.dr-hud .tb-bg { fill: rgba(9, 22, 35, 0.95); opacity: 0; transition: opacity 0.35s ease-out; }
.dr-hud .tb-grid { fill: url(#dr-tbgrid); opacity: 0; transition: opacity 0.6s ease-out 0.2s; }
.dr-hud .ln { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.32s cubic-bezier(0.4, 0.6, 0.2, 1) var(--d, 0ms); }
.dr-hud .ln.hv { stroke-width: 2; }
.dr-hud .tx { opacity: 0; transform: translateY(5px); transition: opacity 0.28s ease-out var(--d, 0ms), transform 0.32s ease-out var(--d, 0ms); }
.dr-hud .lab { fill: #6c9fc3; font: 600 10px var(--dr-font); letter-spacing: 0.18em; }
.dr-hud .val { fill: #d6ecfb; font: 17px var(--dr-font); letter-spacing: 0.04em; }
.dr-hud .sm { fill: #b9d8ee; font: 11px var(--dr-font); letter-spacing: 0.06em; text-anchor: middle; }
.dr-hud .rv { fill: var(--acc); font: 600 14px var(--dr-mono); text-anchor: middle; }
.dr-hud .src { fill: #d6ecfb; font: 600 13px var(--dr-font); letter-spacing: 0.06em; text-transform: uppercase; }
.dr-hud .dsc { fill: #b9d8ee; font: 14px var(--dr-font); }
.dr-hud .sym { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.dr-hud .time {
  font: 300 108px var(--dr-font); letter-spacing: 0.02em; fill: #f0f8ff; fill-opacity: 0;
  stroke: #f0f8ff; stroke-width: 1.2; stroke-dasharray: 420; stroke-dashoffset: 420;
  transition: stroke-dashoffset 0.55s ease-in-out 0.15s, fill-opacity 0.3s ease-out 0.48s, stroke-opacity 0.3s ease-out 0.6s;
}
.dr-hud.in .fr, .dr-hud.in .ln { stroke-dashoffset: 0; }
.dr-hud.in .dr-tb { transform: none; }
.dr-hud.in .tb-bg { opacity: 1; }
.dr-hud.in .tb-grid { opacity: 1; }
.dr-hud.in .tx { opacity: 1; transform: none; }
.dr-hud.in .time { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
.dr-hud.out .fr { stroke-dashoffset: 1; transition: stroke-dashoffset 0.3s ease-in; }

</style>
</head>
<body>
<div id="stage"><div id="fit"><div id="screen">
  <div id="wall"></div><div id="wins"></div><div id="seam"></div><div id="hud"></div><div id="edge"></div>
</div></div></div>
<div id="bar">
  <button data-a="open">Open <kbd>O</kbd></button>
  <button data-a="close">Close focused <kbd>X</kbd></button>
  <span class="sep"></span>
  <button data-a="r11">Snap 1:1 <kbd>1</kbd></button>
  <button data-a="r12">1:2 <kbd>2</kbd></button>
  <button data-a="r21">2:1 <kbd>3</kbd></button>
  <span class="sep"></span>
  <button data-a="focus">Switch focus <kbd>Tab</kbd></button>
  <button data-a="full">Fullscreen <kbd>F</kbd></button>
  <button data-a="hud">HUD <kbd>H</kbd> / hover top edge</button>
  <span class="about">Windows are drafted into existence: construction lines overshoot and trim, dimensions flash, content inks in; an eraser wipes them out; snaps carry live dimension lines; the HUD is a title block.</span>
</div>
<script>
// 3 · Drafting table (blueprint): windows are drafted, dimensioned, inked and erased.
(() => {
  "use strict";
  const SW = 1920;
  const SH = 1080;
  const GAP = 32;
  const NS = "http://www.w3.org/2000/svg";
  let ctx = null;
  let ov = null;
  let fx = null;
  let hudGen = 0;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, t) => a + (b - a) * t;
  const eOut = (t) => 1 - Math.pow(1 - t, 3);
  const eInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);

  // rAF in a real browser; headless virtual time starves rAF, so screenshots tick on timers there
  const tick = /Headless/.test(navigator.userAgent) ? (f) => setTimeout(f, 16) : (f) => requestAnimationFrame(f);
  function tween(ms, fn) {
    return new Promise((res) => {
      const t0 = performance.now();
      const step = () => {
        const t = clamp((performance.now() - t0) / ms);
        fn(t);
        if (t < 1) tick(step);
        else res();
      };
      tick(step);
    });
  }
  function S(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function D(cls, parent) {
    const e = document.createElement("div");
    e.className = cls;
    parent.appendChild(e);
    return e;
  }
  function setLine(l, x1, y1, x2, y2) {
    l.setAttribute("x1", x1);
    l.setAttribute("y1", y1);
    l.setAttribute("x2", x2);
    l.setAttribute("y2", y2);
  }
  function fade(el, ms, delay = 0) {
    const o0 = parseFloat(getComputedStyle(el).opacity) || 1;
    setTimeout(() => tween(ms, (t) => (el.style.opacity = o0 * (1 - eOut(t)))).then(() => el.remove()), delay);
  }
  function frac(w) {
    if (w >= SW - 1) return "FULL";
    const s = Math.round((w / (SW - GAP)) * 6);
    const g = gcd(s, 6) || 1;
    return `${s / g}/${6 / g}`;
  }
  function liveRatio(a, b) {
    if (b <= 0) return "—";
    if (Math.abs(a - b) < 6) return "1:1";
    return a < b ? `1:${(b / a).toFixed(2)}` : `${(a / b).toFixed(2)}:1`;
  }
  function ensureTag(win) {
    let t = win.el.querySelector(".dr-dim-tag");
    if (!t) {
      t = document.createElement("span");
      t.className = "dr-dim-tag";
      win.el.querySelector(".titlebar").appendChild(t);
    }
    if (win.rect) t.textContent = `${Math.round(win.rect.w)} × ${win.rect.h}`;
    return t;
  }

  // a dimension line: arrows both ends, extension ticks, boxed label at the midpoint
  function mkDim(parent) {
    const g = S("g", { class: "dr-dim" }, parent);
    const ln = S("line", { "marker-start": "url(#dr-arr)", "marker-end": "url(#dr-arr)" }, g);
    const e1 = S("line", {}, g);
    const e2 = S("line", {}, g);
    const lab = S("g", { class: "lab" }, g);
    const rect = S("rect", { height: 22 }, lab);
    const txt = S("text", {}, lab);
    let last = "";
    return {
      g,
      set(x1, y1, x2, y2, text, op) {
        g.style.opacity = op;
        if (op <= 0) return;
        setLine(ln, x1, y1, x2, y2);
        const len = Math.hypot(x2 - x1, y2 - y1) || 1;
        const nx = -(y2 - y1) / len;
        const ny = (x2 - x1) / len;
        setLine(e1, x1 - nx * 12, y1 - ny * 12, x1 + nx * 12, y1 + ny * 12);
        setLine(e2, x2 - nx * 12, y2 - ny * 12, x2 + nx * 12, y2 + ny * 12);
        if (text !== last) {
          txt.textContent = text;
          rect.setAttribute("width", text.length * 8 + 18);
          last = text;
        }
        const w = text.length * 8 + 18;
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        rect.setAttribute("x", mx - w / 2);
        rect.setAttribute("y", my - 11);
        txt.setAttribute("x", mx);
        txt.setAttribute("y", my + 1);
        lab.style.opacity = len > w + 30 ? 1 : 0;
      },
    };
  }

  function buildOverlay(screen) {
    const hud = screen.querySelector("#hud");
    ov = S("svg", { class: "dr-ov", viewBox: `0 0 ${SW} ${SH}` });
    ov.innerHTML = `<defs>
      <marker id="dr-arr" viewBox="0 0 14 8" refX="13.5" refY="4" markerWidth="14" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0 0 L14 4 L0 8 L3 4 z" fill="#a9e2ff"/></marker>
      <pattern id="dr-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#a9e2ff" stroke-width="1.3" stroke-opacity=".55"/></pattern>
    </defs>`;
    fx = document.createElement("div");
    fx.className = "dr-fx";
    screen.insertBefore(ov, hud);
    screen.insertBefore(fx, hud);
  }

  function buildSeam(seam) {
    if (seam.querySelector(".dr-seam")) return;
    let tk = "";
    for (let y = 36, i = 0; y < SH - 30; y += 24, i++) {
      const maj = i % 5 === 0;
      tk += `M${GAP / 2 - (maj ? 6 : 3)} ${y}h${maj ? 12 : 6}`;
    }
    seam.innerHTML = `<svg class="dr-seam" width="${GAP}" height="${SH}" viewBox="0 0 ${GAP} ${SH}">
      <line class="sm-ln" x1="${GAP / 2}" y1="14" x2="${GAP / 2}" y2="${SH - 14}" pathLength="1"/>
      <path class="sm-tk" d="${tk}"/>
      <path class="sm-ar" d="M${GAP / 2} 6 l-4 13 h8 z M${GAP / 2} ${SH - 6} l-4 -13 h8 z"/>
    </svg><div class="dr-seam-lab"><span>1:1</span></div>`;
  }
  function reinkSeam(seam) {
    const ln = seam.querySelector(".sm-ln");
    if (!ln) return;
    tween(420, (t) => {
      const p = eOut(t);
      ln.style.strokeDasharray = p >= 1 ? "none" : `0 ${(1 - p) / 2} ${p} 1`;
    });
  }

  function erasePass(target, r, ms, host, onT) {
    // a soft skewed eraser band sweeping left→right; `target` is clipped behind it
    const k = r.h * Math.tan((12 * Math.PI) / 180);
    const BW = Math.min(260, Math.max(140, r.w * 0.22));
    const box = D("dr-erase-box", host);
    Object.assign(box.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
    const band = D("dr-eraser", box);
    Object.assign(band.style, { width: BW + "px", height: r.h + "px" });
    let lastCrumb = 0;
    return tween(ms, (t) => {
      const e = eInOut(t);
      const c = lerp(-k / 2 - BW / 2, r.w + k / 2 + BW / 2, e);
      band.style.transform = `translateX(${c - BW / 2}px) skewX(-12deg)`;
      const top = Math.min(r.w, c + k / 2);
      const bot = Math.min(r.w, c - k / 2);
      target.style.clipPath = `polygon(${top}px 0px, ${r.w}px 0px, ${r.w}px ${r.h}px, ${bot}px ${r.h}px)`;
      if (onT) onT(t, e);
      if (t - lastCrumb > 0.035 && t > 0.05 && t < 0.9) {
        lastCrumb = t;
        for (let i = 0; i < 2; i++) {
          const yr = Math.random() * r.h;
          const x = r.x + c + k / 2 - (yr / r.h) * k;
          const cr = D("dr-crumb", host);

  }

  function wallpaper(wallEl) {
    buildOverlay(wallEl.parentNode);
    wallEl.innerHTML = `<svg class="dr-marks" viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="none">
      <g class="dr-drift">
        <line class="mk cl" x1="80" y1="1010" x2="1180" y2="90"/>
        <g><circle class="mk dt dr-spin" cx="1390" cy="390" r="270"/></g>
        <line class="mk cl" x1="1060" y1="390" x2="1720" y2="390"/>
        <line class="mk cl" x1="1390" y1="80" x2="1390" y2="700"/>
        <path class="mk" d="M1390 390 L1580 200"/>
        <text class="mk-t" x="1530" y="270">R 270</text>
        <circle class="mk" cx="430" cy="690" r="60"/>
        <line class="mk" x1="350" y1="690" x2="510" y2="690"/><line class="mk" x1="430" y1="610" x2="430" y2="770"/>
        <text class="mk-t" x="500" y="630">Ø 120</text>

        <line class="mk" x1="240" y1="866" x2="240" y2="894"/><line class="mk" x1="720" y1="866" x2="720" y2="894"/>
        <text class="mk-t" x="462" y="870">480</text>

        <line class="mk" x1="1380" y1="860" x2="1660" y2="860"/><line class="mk" x1="1380" y1="860" x2="1560" y2="680"/>
        <text class="mk-t" x="1520" y="815">45°</text>

  function ready(c) {
    ctx = c;
    c.state.list.forEach(ensureTag);
  }

  async function onOpen(win) {
    ensureTag(win);
    const el = win.el;
    const r = { ...win.rect };
    const I = 22;
    const O = 64;
    el.classList.add("dr-drawing");
    el.style.opacity = "0";
    el.style.transformOrigin = "50% 50%";
    const c0 = { x: r.x + I, y: r.y + I, w: r.w - 2 * I, h: r.h - 2 * I };
    const g = S("g", {}, ov);
    const hatch = S("rect", { height: 34, fill: "url(#dr-hatch)" }, g);
    const lines = [0, 1, 2, 3].map(() => S("line", { class: "dr-con" }, g));
    const tips = [0, 1, 2, 3].map(() => S("circle", { r: 2.8, class: "dr-tip" }, g));
    const dW = mkDim(g);
    const dH = mkDim(g);
    const flash = S("text", { class: "dr-flash" }, g);
    flash.textContent = `${r.w} × ${r.h}`;
    const sides = (q) => [
      [q.x, q.y, q.x + q.w, q.y],
      [q.x + q.w, q.y, q.x + q.w, q.y + q.h],
      [q.x + q.w, q.y + q.h, q.x, q.y + q.h],
      [q.x, q.y + q.h, q.x, q.y],
    ];

      const se = eInOut(seg(t, 0.58, 1));
      const cur = { x: lerp(c0.x, r.x, se), y: lerp(c0.y, r.y, se), w: lerp(c0.w, r.w, se), h: lerp(c0.h, r.h, se) };
      const ext = O * (1 - eOut(seg(t, 0.46, 0.62)));
      const lineOp = 0.95 * (1 - seg(t, 0.8, 1));
      sides(cur).forEach(([x1, y1, x2, y2], i) => {
        const p = eOut(seg(t, i * 0.065, i * 0.065 + 0.28));
        const len = Math.hypot(x2 - x1, y2 - y1);
        const dx = (x2 - x1) / len;
        const dy = (y2 - y1) / len;
        const head = Math.min(-O + p * (len + 2 * O), len + ext);
        const tail = -ext;
        const ln = lines[i];
        ln.style.opacity = p > 0 && head > tail ? lineOp : 0;
        setLine(ln, x1 + dx * tail, y1 + dy * tail, x1 + dx * head, y1 + dy * head);
        tips[i].setAttribute("cx", x1 + dx * head);
        tips[i].setAttribute("cy", y1 + dy * head);
        tips[i].style.opacity = p > 0 && p < 1 ? 1 : 0;
      });
      // dimensions grow out from the centre, label flashes, then everything recedes
      const dp = eOut(seg(t, 0.24, 0.46));
      const dOp = seg(t, 0.24, 0.3) * (1 - seg(t, 0.74, 0.9));
      const cx = cur.x + cur.w / 2;
      const cy = cur.y + cur.h / 2;
      const hy = cur.y + 92;
      const vx = cur.x + 64;
      dW.set(cx - (dp * cur.w) / 2 + 12 * dp, hy, cx + (dp * cur.w) / 2 - 12 * dp, hy, `W ${r.w}`, dOp);
      dH.set(vx, cy - (dp * cur.h) / 2 + 12 * dp, vx, cy + (dp * cur.h) / 2 - 12 * dp, `H ${r.h}`, dOp);
      const f = seg(t, 0.32, 0.36);
      flash.setAttribute("x", cx);
      flash.setAttribute("y", cy);
      flash.style.opacity = f * (1 - 0.25 * seg(t, 0.36, 0.5)) * (1 - seg(t, 0.72, 0.88));
      flash.style.letterSpacing = `${0.06 + 0.12 * (1 - f)}em`;
      // ink in: top→bottom wipe with a hatched leading band, then the sheet settles to scale
      const ie = eInOut(seg(t, 0.42, 0.88));
      if (t >= 0.42) {
        el.style.opacity = String(0.55 + 0.45 * ie);

      hatch.setAttribute("x", cur.x);
      hatch.setAttribute("width", cur.w);
      hatch.setAttribute("y", cur.y + ie * cur.h - 34);

  }

  async function onClose(win) {
    const el = win.el;
    const r = { ...win.rect };
    const seam = ctx.seam;

    const gh = S("g", { class: "dr-ghost" }, ov);

      [q.x - O, q.y, q.x + q.w + O, q.y],
      [q.x - O, q.y + q.h, q.x + q.w + O, q.y + q.h],

  async function onMove(win, from, to, place) {
    place(win, to);
    ensureTag(win);
    const el = win.el;
    const tag = el.querySelector(".dr-dim-tag");
    const st = ctx && ctx.state;
    const two = st && st.list.length === 2;
    const opening = st && st.list.some((w) => w !== win && w.el.style.visibility === "hidden");
    const isLeft = two && to.x === 0;
    const seam = ctx && ctx.seam;
    const g = S("g", { class: "dr-snap" }, ov);
    const d = mkDim(g);
    const movedL = from.x !== to.x;
    const movedR = from.x + from.w !== to.x + to.w;
    const eL = movedL ? S("line", { class: "dr-ext" }, g) : null;
    const eR = movedR ? S("line", { class: "dr-ext" }, g) : null;

    }

    const y = SH / 2;
    const run = tween(540, (t) => {
      const e = eInOut(t);
      const x = lerp(from.x, to.x, e);
      const w = lerp(from.w, to.w, e);
      el.style.left = x + "px";
      el.style.width = w + "px";
      tag.textContent = `${Math.round(w)} × ${to.h}`;
      const op = seg(t, 0, 0.18);

      if (eL) setLine(eL, x + 1, 40, x + 1, SH - 40);
      if (eR) setLine(eR, x + w - 1, 40, x + w - 1, SH - 40);
      g.style.opacity = op;
      if (lab) {
        seam.style.left = x + w + "px";
        lab.textContent = liveRatio(w, SW - GAP - w);
      }
    }).then(() => {
      place(win, to);
      ensureTag(win);
      fade(g, 600, 260);
    });
    // when a neighbour is about to be drafted, hand over early so the drawing overlaps the glide
    if (opening) await Promise.race([run, ctx.sleep(330)]);
    else await run;
  }

  function onFocus(win) {
    if (!win.el.querySelector(".dr-dim-tag") || win.el.classList.contains("dr-drawing") || !ov) return;
    const r = win.rect;
    const x = r.x + 1;
    const y = r.y + 1;
    const x2 = r.x + r.w - 1;
    const y2 = r.y + r.h - 1;
    const g = S("g", { class: "dr-trace" }, ov);

    tween(260, (t) => {
      const e = eOut(t);

  }

  function seamHook(s) {
    const el = s.seam;
    buildSeam(el);
    if (!s.visible) return;
    el.style.transition = "opacity .3s";
    el.style.opacity = "1";
    const r = ctx ? ctx.state.ratio : [1, 1];
    el.querySelector(".dr-seam-lab span").textContent = `${r[0]}:${r[1]}`;
    if (s.changing) {
      el.classList.add("dr-chg");
      reinkSeam(el);
    } else {
      setTimeout(() => el.classList.remove("dr-chg"), 380);
    }
  }

  // ---- HUD: a drafting title block + sheet frame ----
  const SYM = [
    (cx, cy) => `<circle class="sym" cx="${cx}" cy="${cy}" r="10"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="#a9e2ff"/>`,
    (cx, cy) => `<path class="sym" d="M${cx} ${cy - 11} L${cx + 11} ${cy + 8} H${cx - 11} Z"/>`,
    (cx, cy) => `<rect class="sym" x="${cx - 9}" y="${cy - 9}" width="18" height="18"/><path class="sym" d="M${cx - 9} ${cy + 9} L${cx + 9} ${cy - 9}"/>`,
    (cx, cy) => `<path class="sym" d="M${cx - 12} ${cy - 2} A17 17 0 0 1 ${cx + 12} ${cy - 2} M${cx - 7} ${cy + 3} A10 10 0 0 1 ${cx + 7} ${cy + 3}"/><circle cx="${cx}" cy="${cy + 8}" r="2.2" fill="#a9e2ff"/>`,
    (cx, cy) => `<path class="sym" d="M${cx - 10} ${cy - 4} h5 l6 -6 v20 l-6 -6 h-5 z M${cx + 5} ${cy - 5} q4 5 0 10"/>`,
  ];
  function titleBlock(data) {
    const W2 = 640;
    const n = ctx ? ctx.state.list.length : 2;
    let L = "";
    let i = 0;
    const ln = (x1, y1, x2, y2, cls = "") => {
      L += `<line class="ln ${cls}" pathLength="1" style="--d:${60 + i++ * 16}ms" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    };

    ln(0, 0, W2, 0, "hv");
    ln(W2, 0, W2, 340, "hv");
    ln(W2, 340, 0, 340, "hv");
    ln(0, 340, 0, 0, "hv");
    ln(0, 140, W2, 140);
    ln(0, 226, W2, 226);
    ln(0, 310, W2, 310);
    ln(340, 0, 340, 140);
    ln(340, 46, W2, 46);
    ln(340, 92, W2, 92);
    ln(490, 92, 490, 140);
    ln(96, 140, 96, 310);
    for (let k = 1; k < 5; k++) ln(96 + k * 108.8, 140, 96 + k * 108.8, 226);
    ln(96, 254, W2, 254);
    ln(96, 282, W2, 282);
    ln(136, 226, 136, 310);
    ln(270, 226, 270, 310);

    tx(502, 131, "val", "PX");

      const cx = 96 + k * 108.8 + 54.4;
      T += `<g class="tx" style="--d:${260 + k * 40}ms">${SYM[k % SYM.length](cx, 176)}</g>`;
      tx(cx, 214, "sm", t);
    });
    tx(14, 248, "lab", "REVISIONS");
    data.notes.slice(0, 3).forEach((note, k) => {
      const yb = 226 + k * 28 + 19;
      const at = note.indexOf(":");
      const src = at > 0 ? note.slice(0, at) : "Note";
      const dsc = at > 0 ? note.slice(at + 1).trim() : note;
      tx(116, yb, "rv", String.fromCharCode(65 + k));
      tx(146, yb, "src", src);
      tx(282, yb, "dsc", dsc);
    });
    tx(14, 330, "lab", "CLOCKMOST · DESKTOP ARRANGEMENT");
    tx(452, 330, "lab", "DWG CM-DSK-01");

      <defs><pattern id="dr-tbgrid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0V12H0" fill="none" stroke="rgba(140,200,255,.05)"/></pattern></defs>
      <rect class="tb-bg" width="640" height="340"/><rect class="tb-grid" width="640" height="340"/>
      ${L}${T}
      <text class="time" x="12" y="124">${esc(data.time)}</text>
    </svg>`;
  }
  function sheetFrame() {
    let t = "";
    for (let x = 240; x < SW; x += 240) t += `<line class="fr" pathLength="1" x1="${x}" y1="6" x2="${x}" y2="14"/><line class="fr" pathLength="1" x1="${x}" y1="${SH - 6}" x2="${x}" y2="${SH - 14}"/>`;
    for (let y = 270; y < SH; y += 270) t += `<line class="fr" pathLength="1" x1="6" y1="${y}" x2="14" y2="${y}"/><line class="fr" pathLength="1" x1="${SW - 6}" y1="${y}" x2="${SW - 14}" y2="${y}"/>`;
    return `<svg class="frame" viewBox="0 0 ${SW} ${SH}"><rect class="fr" pathLength="1" x="6" y="6" width="${SW - 12}" height="${SH - 12}"/>${t}</svg>`;
  }
  async function hudShow(hudEl, data) {
    const gen = ++hudGen;
    hudEl.innerHTML = `<div class="dr-hud">${sheetFrame()}<div class="dr-tb">${titleBlock(data)}</div></div>`;
    const root = hudEl.firstElementChild;
    root.getBoundingClientRect();
    tick(() => gen === hudGen && root.classList.add("in"));
    await new Promise((r) => setTimeout(r, 620));
  }
  async function hudHide(hudEl) {
    const gen = ++hudGen;
    const root = hudEl.querySelector(".dr-hud");

    root.classList.add("out");
    const tb = root.querySelector(".dr-tb");
    const r = { x: SW - 30 - 640, y: SH - 30 - 340, w: 640, h: 340 };
    tb.style.transition = "none";

})();

<script>
"use strict";
// ---- harness: a fake 1920x1080 side screen; concepts animate the events -------------------
const W = 1920, H = 1080;

const KINDS = {
  firefox: { title: "Firefox — a long article", body: () => `<div class="ff"><div class="tabs"><div class="tab on">Article</div><div class="tab">Wiki</div><div class="tab">Mail</div></div><div class="url">https://example.org/read</div><div class="page"><div class="h"></div>${lines(14)}</div></div>` },
  discord: { title: "Discord — #general", body: () => `<div class="dc"><div class="side">${'<div class="chan"></div>'.repeat(9)}</div><div class="chat">${msgs(5)}</div></div>` },
  kitty: { title: "kitty — ~", body: () => `<div class="kt">~ ❯ paru -Syu\n:: Synchronizing package databases...\n cachyos-v3 is up to date\n:: Starting full system upgrade...\n there is nothing to do\n~ ❯ █</div>` },
};
function lines(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="line" style="width:${60 + ((i * 37) % 40)}%"></div>`; return s; }
function msgs(n) { let s = ""; for (let i = 0; i < n; i++) s += `<div class="msg"><div class="av"></div><div class="bub"><div class="line" style="width:22%;height:11px;background:#454a7a"></div><div class="line" style="width:${50 + ((i * 29) % 45)}%"></div></div></div>`; return s; }

const state = { list: [], ratio: [1, 1], focused: null, hud: false, busy: false };
const C = window.CONCEPT || {};
const GAP = C.gap ?? 0;
let nextKind = ["kitty", "firefox", "discord"];

function tiles(n) {
  if (n === 1) return [{ x: 0, y: 0, w: W, h: H }];

}
function place(win, r) { Object.assign(win.el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" }); win.rect = { ...r }; }

  const el = document.createElement("div");

}
function seamState(changing) {

async function layout(changing) {

}

}
async function run(fn) { if (state.busy) return; state.busy = true; try { await fn(); } finally { state.busy = false; } }

  open: () => run(async () => {
    if (state.list.length >= 2) return;

    const win = make(kind);
    state.list.push(win);
    const t = tiles(state.list.length);
    place(win, t[state.list.length - 1]);
    win.el.style.visibility = "hidden";
    await layout(true);
    win.el.style.visibility = "";
    focus(win);
    await (C.onOpen?.(win) ?? null);
    seamState(false);
  }),
  close: () => run(async () => {
    const win = state.focused; if (!win) return;
    await (C.onClose?.(win) ?? null);
    win.el.remove();
    state.list = state.list.filter((w) => w !== win);
    state.focused = null;
    await layout(true);
    focus(state.list[0]);
    seamState(false);
  }),
  ratio: (r) => run(async () => { state.ratio = r; await layout(true); await sleep(50); seamState(false); }),
  focus: () => { const i = state.list.indexOf(state.focused); focus(state.list[(i + 1) % state.list.length]); },
  // F: the focused window goes fullscreen (others hidden) and back. Concepts may animate it via
  // onFullscreen(win, on, fromRect, toRect, place) -> Promise; default = instant.
  full: () => run(async () => {
    const win = state.focused; if (!win) return;
    const on = !state.full;
    const others = state.list.filter((w) => w !== win);
    const from = { ...win.rect };
    const to = on ? { x: 0, y: 0, w: W, h: H } : tiles(state.list.length)[state.list.indexOf(win)];
    if (on) { state.full = win; seam.style.display = "none"; }
    if (C.onFullscreen) await C.onFullscreen(win, on, from, to, place, others);
    else { place(win, to); others.forEach((o) => { o.el.style.visibility = on ? "hidden" : ""; }); }
    win.el.classList.toggle("fullscreen", on);
    if (!on) { state.full = null; seamState(false); }
  }),
  hud: async (on = !state.hud) => {
    if (on === state.hud) return;
    state.hud = on;
    hud.classList.toggle("on", on);
    if (on) await (C.hudShow?.(hud, hudData()) ?? null); else await (C.hudHide?.(hud) ?? null);
  },
};
function hudData() {
  const d = new Date();
  return {
    time: d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }),
    date: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }),
    tray: ["Discord", "Steam", "KeePassXC", "Wi-Fi", "Volume 40%"],
    notes: ["Discord: Kuri — gg", "Steam: update ready", "Backup: OK 03:25"],
  };
}
document.querySelectorAll("#bar button").forEach((b) => b.addEventListener("click", () => {
  const a = b.dataset.a;
  if (a === "r11") act.ratio([1, 1]); else if (a === "r12") act.ratio([1, 2]); else if (a === "r21") act.ratio([2, 1]); else act[a]();
}));
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "o") act.open(); else if (k === "x") act.close(); else if (k === "1") act.ratio([1, 1]);
  else if (k === "2") act.ratio([1, 2]); else if (k === "3") act.ratio([2, 1]);
  else if (k === "tab") { e.preventDefault(); act.focus(); } else if (k === "f") act.full(); else if (k === "h") act.hud(); else if (k === "escape") act.hud(false);
});
$("#edge").addEventListener("mouseenter", () => act.hud(true));
screen.addEventListener("mouseleave", () => act.hud(false));
hud.addEventListener("mousedown", (e) => { if (e.target === hud) act.hud(false); });
function fit() { const s = Math.min(innerWidth / W, (innerHeight - 64) / H) * 0.98; $("#fit").style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();
C.wallpaper?.(wall);
(async () => {
  for (const k of ["firefox", "discord"]) { const w = make(k); state.list.push(w); }
  nextKind = ["kitty", "firefox", "discord"];
  await layout(false);
  focus(state.list[0]);
  C.ready?.({ state, screen, wins, seam, hud, wall, W, H, sleep });
  // ?auto=hud,close,r12,open,focus - run actions after load (for headless checks / demos)
  const auto = new URLSearchParams(location.search).get("auto");
  for (const a of auto ? auto.split(",") : []) {
    await sleep(300);
    if (a === "r11") await act.ratio([1, 1]); else if (a === "r12") await act.ratio([1, 2]);
    else if (a === "r21") await act.ratio([2, 1]); else if (act[a]) await act[a]();
  }
})();
