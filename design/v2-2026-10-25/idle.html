<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>v2 idle desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="idle.css" />
  </head>
  <body>
    <!-- Stop 1: idle desktop, nothing open. ?v=paper|graphite|cobalt picks the direction. Layout only. -->
    <div class="stage" id="stage">
      <div class="ground">
        <div class="dots"></div>
        <div class="slab"></div>
        <div class="ghost">
          <span class="ghost-num">25</span>
          <span class="ghost-jp">待機</span>
        </div>
        <div class="reg tl"></div>
        <div class="reg tr"></div>
        <div class="reg bl"></div>
        <div class="reg br"></div>
        <div class="ruler"></div>
        <div class="hatch"></div>
        <div class="spec">
          <b>CLOCKMOST / DT-01</b>
          <span>DP-2 &middot; 1920&times;1080 &middot; 165HZ</span>
          <span>STATE ......... IDLE</span>
          <span>WINDOWS ....... 00</span>
          <span>UPTIME ........ 00:04:12</span>
        </div>
        <div class="code">
          <div class="barcode"></div>
          <span>0 25 10 2026 1842</span>
        </div>
        <div class="cross"></div>
        <div class="tag">STANDBY / 待機中</div>
      </div>

      <header class="bar">
        <div class="bar-left">
          <div class="mark"><i></i>CLOCKMOST</div>
          <div class="ws">
            <span class="on">01</span><span>02</span><span>03</span>
          </div>
          <div class="felt"><i></i>FELT &middot; ONLINE</div>
        </div>
        <div class="bar-clock">
          <span class="time">18:42</span>
          <span class="date">SUN<br />25.10</span>
        </div>
        <div class="bar-right">
          <div class="np">
            <span class="np-art"></span>
            <span class="np-txt"><b>Hibana</b><br />DECO*27</span>
            <span class="np-meter"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="wx">16&deg; <small>LOCAL &middot; CLOUD</small></div>
          <div class="tray"><i></i><i></i><i></i></div>
          <div class="user">M</div>
        </div>
      </header>

      <nav class="dock">
        <div class="tile run"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M7 10c3-1 7-1 10 1M7.5 13c2.5-.8 6-.6 8.5.8M8 16c2-.6 4.5-.4 6.5.6" /></svg><em>SPOTIFY</em></div>
        <div class="tile run focus"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" /><path d="M6 10l3 2-3 2M11 15h5" /></svg><em>KITTY</em></div>
        <div class="tile run"><svg viewBox="0 0 24 24"><path d="M5 7c4-2 10-2 14 0l1 9c-2 2-4 3-5 3l-1-2c-1 .3-3 .3-4 0l-1 2c-1 0-3-1-5-3z" /><circle cx="9.5" cy="12.5" r="1.3" /><circle cx="14.5" cy="12.5" r="1.3" /></svg><em>DISCORD</em></div>
        <div class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18M5 8c3 1 4 4 3 7" /></svg><em>FIREFOX</em></div>
        <div class="tile"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" /><path d="M12 20v-6M9 14l3-3 3 3" /></svg><em>HOME</em></div>
        <div class="sep"></div>
        <div class="tile"><svg viewBox="0 0 24 24"><circle cx="16" cy="9" r="4" /><circle cx="7" cy="16" r="2.5" /><path d="M8.5 14.5l5-3" /></svg><em>STEAM</em></div>
        <div class="tile run"><svg viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 9 19z" /></svg><em>WHATSAPP</em></div>
        <div class="tile run"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z" /></svg><em>FELT</em></div>
        <div class="sep"></div>
        <div class="tile drawer"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l5 5" /></svg><em>SEARCH</em></div>
      </nav>
    </div>
    <script>
      const v = new URLSearchParams(location.search).get("v") || "paper";
      document.getElementById("stage").dataset.v = v;
    </script>
  </body>
</html>
